[package]
name = "benches"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# regolith is the only backend, so there is no per-backend feature to pass
# through and no target that has to gate on one.
[features]
default = []

[dev-dependencies]
bytes.workspace = true
criterion.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "test-util",
] }

async-trait.workspace = true
axum.workspace = true
cid.workspace = true
lru.workspace = true
multihash.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "3.8"
tower = { workspace = true, features = ["util"] }

blockstore = { path = "../crates/blockstore" }
crdt = { path = "../crates/crdt" }
crypto = { path = "../crates/crypto" }
datastore = { path = "../crates/datastore" }
db = { path = "../crates/db" }
defra-core = { path = "../crates/defra-core" }
defra-http = { path = "../crates/http", features = ["test-utils"] }
document = { path = "../crates/document" }
query = { path = "../crates/query" }
schema = { path = "../crates/schema" }
storage = { path = "../crates/storage" }

# How a bench reports what it measured to the performance site.
defra-perf = { path = "../tools/perf" }

# Crates the coverage sweep reaches that the older benches never linked.
acp = { path = "../crates/acp" }
cursor = { path = "../crates/cursor" }
libp2p-identity = { version = "0.2", features = ["ed25519", "peerid"] }
p2p = { path = "../crates/p2p" }
replication-filter = { path = "../crates/replication-filter" }
events = { path = "../crates/events", features = ["channel"] }
identity = { path = "../crates/identity" }
x25519-dalek = "2"

[[bench]]
name = "acp"
harness = false

[[bench]]
name = "allocs"
harness = false

