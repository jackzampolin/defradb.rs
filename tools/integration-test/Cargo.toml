[package]
name = "integration-test"
version = "0.1.0"
edition = "2021"
description = "Integration test harness for defradb"
license = "Apache-2.0 OR MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
regex = "1"
rand = "0.8"
paste = "1.0"
libc = "0.2"
futures = "0.3"
defra-version = { path = "../../crates/defra-version" }
cosmrs = { version = "0.22", features = ["rpc"] }

[dev-dependencies]
tempfile = "3.17"
identity = { path = "../../crates/identity" }
crypto = { path = "../../crates/crypto" }
base64 = "0.22"
hex = "0.4"
