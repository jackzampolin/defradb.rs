[package]
name = "integration-test"
version = "0.1.0"
edition = "2021"
description = "Integration test harness for defradb"
license = "Apache-2.0 OR MIT"
autotests = false

[[test]]
name = "basic"
path = "tests/basic.rs"

[[test]]
name = "query"
path = "tests/query.rs"

[[test]]
name = "acp"
path = "tests/acp.rs"

[[test]]
name = "nac"
path = "tests/nac.rs"

[[test]]
name = "p2p"
path = "tests/p2p.rs"

[[test]]
name = "p2p_admission"
path = "tests/p2p_admission.rs"

[[test]]
name = "p2p_admission_restart"
path = "tests/p2p_admission_restart.rs"

[[test]]
name = "p2p_admission_fairness"
path = "tests/p2p_admission_fairness.rs"

[[test]]
name = "p2p_interop_bench"
path = "tests/p2p_interop_bench.rs"

[[test]]
name = "issue1154_repro"
path = "tests/issue1154_repro.rs"

[[test]]
name = "issue1194_repro"
path = "tests/issue1194_repro.rs"

[[test]]
name = "issue1211_repro"
path = "tests/issue1211_repro.rs"

[[test]]
name = "p2p_backlog"
path = "tests/p2p_backlog.rs"

[[test]]
name = "p2p_push_storm"
path = "tests/p2p_push_storm.rs"

[[test]]
name = "p2p_deep_catchup"
path = "tests/p2p_deep_catchup.rs"

[[test]]
name = "encryption"
path = "tests/encryption.rs"

[[test]]
name = "identity"
path = "tests/identity.rs"

[[test]]
name = "backup"
path = "tests/backup.rs"

[[test]]
name = "sourcehub"
path = "tests/sourcehub.rs"

[[test]]
name = "hubrs"
path = "tests/hubrs.rs"

[[test]]
name = "fts"
path = "tests/fts.rs"

[[test]]
name = "p2p_iroh"
path = "tests/p2p_iroh/main.rs"

[[test]]
name = "cursor"
path = "tests/cursor.rs"

[dependencies]
hub-harness = { git = "https://github.com/sourcenetwork/backbone.git", rev = "d14172101436e5a3f62c967c34e7db8bc230aa79" }
defra-harness = { git = "https://github.com/sourcenetwork/backbone.git", rev = "d14172101436e5a3f62c967c34e7db8bc230aa79" }
document = { path = "../../crates/document" }
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde_json = "1.0"
anyhow = "1.0"
futures = "0.3"
paste = "1.0"
ctor = "0.2"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.17"
libc = "0.2"
identity = { path = "../../crates/identity" }
crypto = { path = "../../crates/crypto" }
p2p = { path = "../../crates/p2p", features = ["iroh-transport"] }
base64 = "0.22"
hex = "0.4"
cid = { workspace = true }
serial_test = "3"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
mach2 = "0.4"
