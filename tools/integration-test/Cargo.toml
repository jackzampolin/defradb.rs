[package]
name = "integration-test"
version = "0.1.0"
edition = "2021"
description = "Integration test harness for defradb"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
regex = "1"
rand = "0.8"
paste = "1.0"
libc = "0.2"
futures = "0.3"
cosmrs = { version = "0.22", features = ["rpc"] }

[dev-dependencies]
tempfile = "3.17"
