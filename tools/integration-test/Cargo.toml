[package]
name = "integration-test"
version = "0.1.0"
edition = "2021"
description = "Integration test harness for defradb"
license = "Apache-2.0 OR MIT"
autotests = false

[[test]]
name = "basic"
path = "tests/basic.rs"

[[test]]
name = "query"
path = "tests/query.rs"

[[test]]
name = "acp"
path = "tests/acp.rs"

[[test]]
name = "nac"
path = "tests/nac.rs"

[[test]]
name = "p2p"
path = "tests/p2p.rs"

[[test]]
name = "encryption"
path = "tests/encryption.rs"

[[test]]
name = "identity"
path = "tests/identity.rs"

[[test]]
name = "backup"
path = "tests/backup.rs"

[[test]]
name = "sourcehub"
path = "tests/sourcehub.rs"

[[test]]
name = "hubrs"
path = "tests/hubrs.rs"

[[test]]
name = "fts"
path = "tests/fts.rs"

[[test]]
name = "p2p_iroh"
path = "tests/p2p_iroh/main.rs"

[[test]]
name = "cursor"
path = "tests/cursor.rs"

[dependencies]
hub-harness = { git = "https://github.com/sourcenetwork/backbone.git", branch = "main" }
defra-harness = { git = "https://github.com/sourcenetwork/backbone.git", branch = "main" }
document = { path = "../../crates/document" }
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde_json = "1.0"
anyhow = "1.0"
futures = "0.3"
paste = "1.0"
ctor = "0.2"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.17"
identity = { path = "../../crates/identity" }
crypto = { path = "../../crates/crypto" }
p2p = { path = "../../crates/p2p", features = ["iroh-transport"] }
base64 = "0.22"
hex = "0.4"
cid = "0.10"
serial_test = "3"

[lints]
workspace = true
