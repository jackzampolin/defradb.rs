[package]
name = "pir-poc"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Isolated private information retrieval proof of concept for DefraDB"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
blake3 = "1.8"
defra-node = { path = "../../crates/defra-node", default-features = false, features = ["native"] }
events = { path = "../../crates/events" }
fss-rs = { version = "0.6", default-features = false, features = ["prg", "stable"] }
hex.workspace = true
memory-stats = "1.2"
epserde = "0.13"
ptr_hash = { version = "2.0.2", features = ["epserde"] }
query = { path = "../../crates/query" }
rand.workspace = true
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[lints]
workspace = true
