[package]
name = "pir-poc"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Isolated private information retrieval proof of concept for DefraDB"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
blake3 = "1.8"
chalametpir_client = "=0.8.0"
chalametpir_server = "=0.8.0"
defra-node = { path = "../../crates/defra-node", default-features = false, features = ["native"] }
dpf = { version = "0.2.0", optional = true }
hex.workspace = true
memory-stats = "1.2"
query = { path = "../../crates/query" }
rand.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[features]
dpf-compare = ["dep:dpf"]

[lints]
workspace = true
