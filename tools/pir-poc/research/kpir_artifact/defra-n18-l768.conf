# MPC4J Practical Keyword PIR artifact gate.
#
# This matches the Defra comparison dimensions (2^18 keyword pages, 96-byte
# values) but MPC4J's main program generates random values and uses decimal
# ordinal strings as keywords. It does not consume the Defra encoded corpus.

server_name = server
server_ip = 127.0.0.1
server_port = 19022

client_name = client
client_ip = 127.0.0.1
client_port = 19023

append_string = defra_n18_l768_q100

pto_type = SINGLE_CP_KS_PIR
entry_bit_length = 768
server_log_set_size = 18
query_num = 100
parallel = false

# Replaced by run-local.sh. Exact upstream spellings are SIMPLE_NAIVE,
# SIMPLE_BIN, PGM_INDEX, and CHALAMET.
single_cp_ks_pir_pto_name = PGM_INDEX
