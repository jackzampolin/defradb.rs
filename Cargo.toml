[workspace]
resolver = "2"
members = [
    "crates/defra-core",
    "crates/crdt",
    "crates/storage",
    "crates/blockstore",
    "crates/schema",
    "crates/query",
    "crates/document",
    "crates/p2p",
    "crates/crypto",
    "crates/http",
    "crates/cli",
    "crates/datastore",
    "crates/db",
    "crates/keyring",
    "crates/identity",
    "crates/acp",
    "crates/events",
    "crates/ffi",
    "crates/lens",
    "crates/wasm",
]

[workspace.package]
version = "0.1.0"
authors = ["Source Network <contact@source.network>"]
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/sourcenetwork/defradb.rs"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
async-lock = "3"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"
serde_bytes = "0.11"
ciborium = "0.2"

# P2P networking
# Note: Using 0.53 to match iroh-bitswap's dependency
libp2p = { version = "0.53", features = ["tcp", "noise", "yamux", "gossipsub", "kad", "identify", "mdns"] }
iroh-bitswap = { git = "https://github.com/sourcenetwork/beetle", branch = "main" }
libp2p-stream = "0.1.0-alpha.1"
multiaddr = "0.18"

# Storage
redb = "2.4"

# Cryptography
ed25519-dalek = { version = "2.1", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
k256 = { version = "0.13", features = ["ecdsa", "serde"] }
sha2 = "0.10"
aes-gcm = "0.10"
hex = "0.4"
base64 = "0.22"

# IPLD
cid = { version = "0.10", features = ["serde"] }
multihash = "0.18"
serde_ipld_dagcbor = "0.6"
libipld = { version = "0.16", features = ["serde-codec"] }

# GraphQL
graphql-parser = "0.4"

# HTTP
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Bytes
bytes = "1.5"

# Logging
tracing = "0.1"

# Testing
proptest = "1.4"

# Synchronization (non-poisoning locks)
parking_lot = "0.12"

# Async streams
tokio-stream = "0.1"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.test]
opt-level = 1

[profile.bench]
opt-level = 3
