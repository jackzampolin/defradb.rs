[workspace]
resolver = "2"
members = [
    "crates/defra-core",
    "crates/crdt",
    "crates/storage",
    "crates/blockstore",
    "crates/embedded",
    "crates/schema",
    "crates/query",
    "crates/query-types",
    "crates/query-parse",
    "crates/query-plan",
    "crates/document",
    "crates/p2p",
    "crates/crypto",
    "crates/http",
    "crates/cli",
    "crates/datastore",
    "crates/db",
    "crates/db-blocks",
    "crates/db-index",
    "crates/db-nac",
    "crates/db-merge",
    "crates/db-search",
    "crates/keyring",
    "crates/identity",
    "crates/zanzibar",
    "crates/acp",
    "crates/defra-version",
    "crates/sourcehub",
    "crates/events",
    "crates/ffi",
    "crates/lens",
    "crates/orbis",
    "crates/wasm",
    "crates/pg-compat",
    "crates/defra-node",
    "tools/ffi-test",
    "tools/integration-test",
]

[workspace.package]
version = "0.5.0"
authors = ["Source Network <contact@source.network>"]
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/sourcenetwork/defradb.rs"

# Workspace-wide clippy lint config. Each crate inherits these via
# `[lints] workspace = true` in its own Cargo.toml.
#
# `await_holding_lock` and `await_holding_refcell_ref` catch the
# concrete bug pattern where a sync mutex (or RefCell) guard is held
# across an `.await` point. This blocks the tokio worker thread for the
# entire duration of the future and can deadlock a multi-threaded
# runtime. The audit in #673 confirmed no current site triggers this,
# but the lint enforces the discipline going forward so future
# contributors can't accidentally introduce it. Use `tokio::sync::Mutex`
# (or restructure to drop the guard before awaiting) in any flagged
# site.
[workspace.lints.clippy]
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
async-lock = "3"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"
serde_bytes = "0.11"
ciborium = "0.2"

# P2P networking
# Note: Using 0.53 to match iroh-bitswap's dependency
libp2p = { version = "0.53", features = ["tcp", "noise", "yamux", "gossipsub", "kad", "identify", "relay"] }
iroh-bitswap = { git = "https://github.com/sourcenetwork/beetle", branch = "main" }
libp2p-stream = "0.1.0-alpha.1"
multiaddr = "0.18"

# Iroh P2P transport (alternative to libp2p)
iroh = "0.97"
iroh-gossip = "0.97"
iroh-blobs = "0.99"
iroh-tickets = "0.4"
postcard = { version = "1.0", features = ["alloc"] }

# Storage
redb = "2.4"
fjall = "3"
rocksdb = "0.22"

# Cryptography
ed25519-dalek = { version = "2.1", features = ["serde", "zeroize"] }
uuid = { version = "1.0", features = ["v4"] }
k256 = { version = "0.13", features = ["ecdsa", "serde"] }
sha2 = { version = "0.10", features = ["asm"] }
rand = "0.8"
aes-gcm = "0.10"
hex = "0.4"
base64 = "0.22"

# EVM / Alloy (hub.rs ACP backend)
alloy-sol-types = "1"
alloy-primitives = { version = "1", features = ["serde"] }
alloy-consensus = { version = "1", features = ["k256"] }
alloy-eips = "1"
alloy-signer = "1"
alloy-signer-local = { version = "1", default-features = false }
alloy-rlp = "0.3"
bs58 = "0.5"

# IPLD
cid = { version = "0.10", features = ["serde"] }
multihash = "0.18"
multicodec = "0.1"
serde_ipld_dagcbor = "0.6"
libipld = { version = "0.16", features = ["serde-codec"] }

# Full-text search
bm25 = "2.3"

# GraphQL
graphql-parser = "0.4"

# HTTP
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["timeout", "limit"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# gRPC (Orbis ring integration)
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"

# Bytes
bytes = "1.5"

# Logging
tracing = "0.1"

# Testing
proptest = "1.4"
criterion = { version = "0.5", features = ["async_tokio"] }

# Synchronization (non-poisoning locks)
parking_lot = "0.12"

# Caching
lru = "0.16.3"

# Async streams
tokio-stream = "0.1"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true

[profile.bench]
opt-level = 3

[profile.profile]
inherits = "release"
strip = false
debug = 1
lto = "thin"
