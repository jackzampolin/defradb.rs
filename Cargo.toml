[workspace]
resolver = "2"
members = [
    "crates/defra-core",
    "crates/crdt",
    "crates/storage",
    "crates/blockstore",
    "crates/embedded",
    "crates/schema",
    "crates/query",
    "crates/query-types",
    "crates/query-parse",
    "crates/query-plan",
    "crates/document",
    "crates/p2p",
    "crates/p2p-adapter",
    "crates/crypto",
    "crates/cursor",
    "crates/http",
    "crates/cli",
    "crates/datastore",
    "crates/db",
    "crates/db-backup",
    "crates/db-blocks",
    "crates/db-index",
    "crates/db-nac",
    "crates/db-merge",
    "crates/db-search",
    "crates/keyring",
    "crates/kms",
    "crates/identity",
    "crates/zanzibar",
    "crates/acp",
    "crates/defra-version",
    "crates/sourcehub",
    "crates/events",
    "crates/ffi",
    "crates/lens",
    "crates/orbis",
    "crates/wasm",
    "crates/pg-compat",
    "crates/defra-node",
    "crates/replication-filter",
    "crates/telemetry",
    "tools/lens-host",
    "tools/ffi-test",
    "tools/integration-test",
    "proofs",
]

[workspace.package]
version = "0.5.0"
authors = ["Source Network <contact@source.network>"]
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/sourcenetwork/defradb.rs"

# Workspace-wide clippy lint config. Each crate inherits these via
# `[lints] workspace = true` in its own Cargo.toml.
#
# `await_holding_lock` and `await_holding_refcell_ref` catch the
# concrete bug pattern where a sync mutex (or RefCell) guard is held
# across an `.await` point. This blocks the tokio worker thread for the
# entire duration of the future and can deadlock a multi-threaded
# runtime. The audit in #673 confirmed no current site triggers this,
# but the lint enforces the discipline going forward so future
# contributors can't accidentally introduce it. Use `tokio::sync::Mutex`
# (or restructure to drop the guard before awaiting) in any flagged
# site.
[workspace.lints.clippy]
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"

[workspace.dependencies]
defra-p2p-adapter = { path = "crates/p2p-adapter", default-features = false }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
async-lock = "3"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
ciborium = "0.2"

web-time = "1.1"

# P2P networking
# Keep these on the same libp2p-swarm release line.
libp2p = { version = "0.56", features = ["tcp", "noise", "yamux", "gossipsub", "kad", "identify", "relay", "dns", "quic", "websocket", "secp256k1"] }
iroh-bitswap = { git = "https://github.com/sourcenetwork/beetle", rev = "d1e12c7cf6dc653d8f0abeb9f804824656fb3621" }
libp2p-stream = "0.4.0-alpha"
multiaddr = "0.18"

# Iroh P2P transport (alternative to libp2p)
iroh = "1.0.1"
iroh-gossip = "0.101.0"
iroh-tickets = "1.0.0"
postcard = { version = "1.0", features = ["alloc"] }

# Storage
redb = "2.4"
fjall = "3.1.4"
rocksdb = "0.24.0"
lark-kv = { git = "https://github.com/sourcenetwork/lark.git", rev = "d1ec2e727bad6c160e6c1d71e2cbb163892b3a02" }

# Cryptography
ed25519-dalek = { version = "2.1", features = ["serde", "zeroize"] }
uuid = { version = "1.23.0", features = ["v4"] }
k256 = { version = "0.13", features = ["ecdsa", "serde"] }
sha2 = { version = "0.10", features = ["asm"] }
# Pinned to 0.8: rand 0.9 bumped rand_core to 0.9, but the stable
# RustCrypto ecosystem (k256 0.13, p256 0.13, ed25519-dalek 2.1,
# x25519-dalek 2.x, aes-gcm 0.10) still pins rand_core 0.6, so passing
# rand 0.9's `OsRng` as an RNG argument to any of these crates fails with
# trait-bound errors. rand_core-0.9-compatible releases exist only as
# prereleases (ed25519-dalek 3.0-pre, k256 0.14-rc, …). Bump together
# once those stabilize. Tracked in #652.
rand = "0.8"
aes-gcm = "0.10"
hex = "0.4"
base64 = "0.22"

# EVM / Alloy (hub.rs ACP backend)
alloy-sol-types = "1"
alloy-primitives = { version = "1", features = ["serde"] }
alloy-consensus = { version = "1", features = ["k256"] }
alloy-eips = "1"
alloy-signer = "1"
alloy-signer-local = { version = "1", default-features = false }
alloy-rlp = "0.3.15"
bs58 = "0.5"

# IPLD
# Use cid 0.11.3+ through the ipld-core/serde_ipld_dagcbor stack so fresh
# downstream resolution does not pull cid 0.10/0.11.1 and yanked core2 0.4.
cid = { version = "0.11.3", features = ["serde"] }
multihash = "0.19"
multihash-codetable = { version = "0.2.2", features = ["sha2"] }
multicodec = "0.1"
serde_ipld_dagcbor = "0.6"
ipld-core = { version = "0.4", features = ["codec", "serde"] }

# Full-text search
bm25 = "2.3"

# GraphQL
graphql-parser = "0.4"

# HTTP
axum = { version = "0.8.9", features = ["ws"] }
tower = { version = "0.5", features = ["timeout", "limit"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = "1.9.0"

# Error handling
thiserror = "2"
anyhow = "1.0"

# gRPC (Orbis ring integration)
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tonic-build = "0.14"
tonic-prost-build = "0.14"

# Bytes
bytes = "1.5"

# Logging
tracing = "0.1"

# Testing
proptest = "1.11.0"
criterion = { version = "0.6", features = ["async_tokio"] }

# Synchronization (non-poisoning locks)
parking_lot = "0.12"

# Caching
lru = "0.16.4"

# Async streams
tokio-stream = "0.1"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true

[profile.bench]
opt-level = 3

[profile.profile]
inherits = "release"
strip = false
debug = 1
lto = "thin"

# Fast release iteration for CI/dev: measured 1m40s cold vs 6m44s fat LTO
# (+25% binary size — never ship artifacts from this profile).
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

