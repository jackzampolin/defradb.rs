name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            platform: linux_amd64
            runner: '["ubuntu-latest"]'
          - target: aarch64-unknown-linux-gnu
            platform: linux_arm64
            runner: '["self-hosted", "Linux", "ARM64"]'
          - target: x86_64-apple-darwin
            platform: darwin_amd64
            runner: '["self-hosted", "macOS", "ARM64", "studio"]'
          - target: aarch64-apple-darwin
            platform: darwin_arm64
            runner: '["self-hosted", "macOS", "ARM64", "studio"]'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-release"
          shared-key: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          NEEDS_APT=0
          if ! command -v pkg-config >/dev/null 2>&1; then
            NEEDS_APT=1
          elif ! pkg-config --exists openssl dbus-1; then
            NEEDS_APT=1
          fi
          if ! command -v protoc >/dev/null 2>&1; then
            NEEDS_APT=1
          fi
          if [ "$NEEDS_APT" -eq 0 ]; then
            echo "Linux build dependencies already installed; skipping apt."
            exit 0
          fi

          APT_ARGS=()
          if [ "$(dpkg --print-architecture)" = "arm64" ]; then
            APT_ARGS=(-o APT::Architecture=arm64 -o APT::Architectures=arm64)
          fi

          bash .github/scripts/apt-update-without-nodesource.sh "${APT_ARGS[@]}"
          sudo apt-get "${APT_ARGS[@]}" install -y libssl-dev pkg-config protobuf-compiler libdbus-1-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Isolate the release dependency graph
        # Cargo resolves every workspace member even for a package-specific build.
        # These test-only members pin Git revisions that release builds do not use.
        run: |
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' '/"tools\/integration-test"/d; /"tools\/ffi-test"/d; /"proofs"/d' Cargo.toml
          else
            sed -i '/"tools\/integration-test"/d; /"tools\/ffi-test"/d; /"proofs"/d' Cargo.toml
          fi

      - name: Build
        run: >-
          cargo build --release -p cli --target ${{ matrix.target }}
          --no-default-features --features release-full

      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="defra_${TAG}_${{ matrix.platform }}.tar.gz"
          tar czf "${ARCHIVE}" -C "target/${{ matrix.target }}/release" defra
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: defra-${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}

      - name: Cleanup
        if: always()
        run: |
          git checkout -- .
          git clean -fd

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-release"
          shared-key: "wasm32"

      - name: Install system dependencies
        run: |
          bash .github/scripts/apt-update-without-nodesource.sh
          sudo apt-get install -y protobuf-compiler

      - name: Isolate the WASM dependency graph
        # Avoid resolving test-only Git dependencies that this build does not use.
        run: sed -i '/"tools\/integration-test"/d; /"tools\/ffi-test"/d; /"proofs"/d' Cargo.toml

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        run: CARGO_PROFILE_RELEASE_OPT_LEVEL=z wasm-pack build crates/wasm --release --target web --out-dir ../../pkg/wasm

      - name: Package
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="defra-wasm_${TAG}.tar.gz"
          tar czf "${ARCHIVE}" -C pkg/wasm defra_wasm_bg.wasm defra_wasm.js defra_wasm.d.ts
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: defra-wasm
          path: ${{ env.ARCHIVE }}

      - name: Cleanup
        if: always()
        run: |
          git checkout -- .
          git clean -fd

  build-ffi:
    name: FFI ${{ matrix.variant }} (${{ matrix.platform }})
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            platform: linux_amd64
            runner: '["ubuntu-latest"]'
            variant: full
            artifact: defra-ffi
            features: "native,wasmtime-runtime,sourcehub"
          - target: aarch64-unknown-linux-gnu
            platform: linux_arm64
            runner: '["self-hosted", "Linux", "ARM64"]'
            variant: full
            artifact: defra-ffi
            features: "native,wasmtime-runtime,sourcehub"
          - target: x86_64-apple-darwin
            platform: darwin_amd64
            runner: '["self-hosted", "macOS", "ARM64", "studio"]'
            variant: full
            artifact: defra-ffi
            features: "native,wasmtime-runtime,sourcehub"
          - target: aarch64-apple-darwin
            platform: darwin_arm64
            runner: '["self-hosted", "macOS", "ARM64", "studio"]'
            variant: full
            artifact: defra-ffi
            features: "native,wasmtime-runtime,sourcehub"
          - target: x86_64-unknown-linux-gnu
            platform: linux_amd64
            runner: '["ubuntu-latest"]'
            variant: lean
            artifact: defra-ffi-lean
            features: "native"
          - target: aarch64-unknown-linux-gnu
            platform: linux_arm64
            runner: '["self-hosted", "Linux", "ARM64"]'
            variant: lean
            artifact: defra-ffi-lean
            features: "native"
          - target: x86_64-apple-darwin
            platform: darwin_amd64
            runner: '["self-hosted", "macOS", "ARM64", "studio"]'
            variant: lean
            artifact: defra-ffi-lean
            features: "native"
          - target: aarch64-apple-darwin
            platform: darwin_arm64
            runner: '["self-hosted", "macOS", "ARM64", "studio"]'
            variant: lean
            artifact: defra-ffi-lean
            features: "native"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-ffi"
          shared-key: ${{ matrix.target }}-${{ matrix.variant }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          NEEDS_APT=0
          if ! command -v pkg-config >/dev/null 2>&1; then
            NEEDS_APT=1
          elif ! pkg-config --exists openssl dbus-1; then
            NEEDS_APT=1
          fi
          if ! command -v protoc >/dev/null 2>&1; then
            NEEDS_APT=1
          fi
          if [ "$NEEDS_APT" -eq 0 ]; then
            echo "Linux build dependencies already installed; skipping apt."
            exit 0
          fi

          APT_ARGS=()
          if [ "$(dpkg --print-architecture)" = "arm64" ]; then
            APT_ARGS=(-o APT::Architecture=arm64 -o APT::Architectures=arm64)
          fi

          bash .github/scripts/apt-update-without-nodesource.sh "${APT_ARGS[@]}"
          sudo apt-get "${APT_ARGS[@]}" install -y libssl-dev pkg-config protobuf-compiler libdbus-1-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Isolate the FFI dependency graph
        # Avoid resolving test-only Git dependencies that this build does not use.
        run: |
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' '/"tools\/integration-test"/d; /"tools\/ffi-test"/d; /"proofs"/d' Cargo.toml
          else
            sed -i '/"tools\/integration-test"/d; /"tools\/ffi-test"/d; /"proofs"/d' Cargo.toml
          fi

      - name: Install cbindgen
        run: cargo install cbindgen

      - name: Build FFI
        run: |
          cargo build --release -p ffi --target ${{ matrix.target }} \
            --no-default-features --features ${{ matrix.features }}

      - name: Generate header
        run: cbindgen --config crates/ffi/cbindgen.toml --crate ffi --output defra.h

      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="${{ matrix.artifact }}_${TAG}_${{ matrix.platform }}.tar.gz"
          RELEASE_DIR="target/${{ matrix.target }}/release"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            LIB="libdefra_ffi.dylib"
            cp "${RELEASE_DIR}/libffi.dylib" "${RELEASE_DIR}/${LIB}"
            install_name_tool -id "@rpath/${LIB}" "${RELEASE_DIR}/${LIB}"
            codesign --force --sign - "${RELEASE_DIR}/${LIB}"
          else
            LIB="libdefra_ffi.so"
            cp "${RELEASE_DIR}/libffi.so" "${RELEASE_DIR}/${LIB}"
          fi
          tar czf "${ARCHIVE}" \
            -C "${RELEASE_DIR}" "${LIB}" \
            -C "${GITHUB_WORKSPACE}" defra.h
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Capability manifest
        shell: bash
        run: |
          MANIFEST="${ARCHIVE%.tar.gz}.capabilities"
          printf '%s|%s|%s\n' \
            "${{ matrix.artifact }}" "${{ matrix.platform }}" "${{ matrix.features }}" \
            > "${MANIFEST}"
          echo "MANIFEST=${MANIFEST}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ matrix.platform }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.MANIFEST }}

      - name: Cleanup
        if: always()
        run: |
          git checkout -- .
          git clean -fd

  build-apple-ffi:
    name: FFI iOS XCFramework (${{ matrix.variant }})
    runs-on: ["self-hosted", "macOS", "ARM64", "studio"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: iroh
            artifact: defra-ffi-iroh
            features: iroh,native,sourcehub
          - variant: lean
            artifact: defra-ffi-lean
            features: native
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-apple-ffi"
          shared-key: "ios-${{ matrix.variant }}"

      - name: Install system dependencies
        run: brew install protobuf

      - name: Isolate the Apple FFI dependency graph
        # Avoid resolving test-only Git dependencies that this build does not use.
        run: sed -i '' '/"tools\/integration-test"/d; /"tools\/ffi-test"/d; /"proofs"/d' Cargo.toml

      - name: Install cbindgen
        run: cargo install cbindgen

      - name: Build Apple FFI
        env:
          FEATURES: ${{ matrix.features }}
          NO_DEFAULT_FEATURES: "1"
          OUT_DIR: ${{ github.workspace }}/target/apple-ffi
        run: |
          if command -v protoc >/dev/null 2>&1; then
            export PROTOC="$(command -v protoc)"
          fi
          tools/apple/build-ffi.sh

      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="${{ matrix.artifact }}_${TAG}_ios_xcframework.tar.gz"
          tar czf "${ARCHIVE}" -C target/apple-ffi include lib xcframework swift
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Capability manifest
        shell: bash
        run: |
          MANIFEST="${ARCHIVE%.tar.gz}.capabilities"
          printf '%s|ios_xcframework|%s\n' \
            "${{ matrix.artifact }}" "${{ matrix.features }}" \
            > "${MANIFEST}"
          echo "MANIFEST=${MANIFEST}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-ios_xcframework
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.MANIFEST }}

      - name: Cleanup
        if: always()
        run: |
          git checkout -- .
          git clean -fd

  docker:
    name: Docker
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: defra-linux_amd64
          path: docker-context/linux/amd64

      - uses: actions/download-artifact@v4
        with:
          name: defra-linux_arm64
          path: docker-context/linux/arm64

      - name: Extract binaries
        run: |
          cd docker-context/linux/amd64 && tar xzf *.tar.gz && rm *.tar.gz
          cd ../arm64 && tar xzf *.tar.gz && rm *.tar.gz

      - uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sourcenetwork/defradb-rs:${{ github.ref_name }}
            ghcr.io/sourcenetwork/defradb-rs:latest

  release:
    name: Release
    needs: [build, build-ffi, build-apple-ffi, build-wasm, docker]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs['build-ffi'].result == 'success' &&
      needs['build-apple-ffi'].result == 'success' &&
      needs['build-wasm'].result == 'success' &&
      needs.docker.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: defra-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: defra-ffi-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: defra-wasm
          merge-multiple: true

      - name: Report release artifact sizes
        run: |
          if ! command -v brotli >/dev/null 2>&1; then
            bash .github/scripts/apt-update-without-nodesource.sh
            sudo apt-get install -y brotli
          fi

          PREVIOUS_TAG=$(git describe "${GITHUB_REF_NAME}^" --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          mkdir -p previous-artifacts
          if [ -n "$PREVIOUS_TAG" ]; then
            for archive in artifacts/*.tar.gz; do
              name=${archive##*/}
              case "$name" in
                defra-ffi-*ios_xcframework*) continue ;;
              esac
              previous_name=${name/"$GITHUB_REF_NAME"/"$PREVIOUS_TAG"}
              url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${PREVIOUS_TAG}/${previous_name}"
              if ! curl --fail --location --silent --show-error --retry 3 \
                --connect-timeout 20 --max-time 300 \
                --output "previous-artifacts/$previous_name" "$url"; then
                rm -f "previous-artifacts/$previous_name"
                echo "::warning::No previous artifact found for $name"
              fi
            done
          fi

          bash .github/scripts/report-release-sizes.sh \
            artifacts previous-artifacts "$GITHUB_REF_NAME" "$PREVIOUS_TAG"

      - name: Build the capability matrix
        run: |
          bash .github/scripts/release-capability-matrix.sh artifacts > capability-matrix.md
          cat capability-matrix.md >> "$GITHUB_STEP_SUMMARY"

      - name: List release artifacts
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
          body_path: capability-matrix.md
          append_body: true
