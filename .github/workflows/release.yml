name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.variant }} (${{ matrix.platform }})
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # rocksdb (default storage backend)
          - variant: rocksdb
            target: x86_64-unknown-linux-gnu
            platform: linux_amd64
            runner: '["self-hosted", "Linux", "X64"]'
            features: ""
          - variant: rocksdb
            target: aarch64-unknown-linux-gnu
            platform: linux_arm64
            runner: '["self-hosted", "Linux", "ARM64"]'
            features: ""
          - variant: rocksdb
            target: x86_64-apple-darwin
            platform: darwin_amd64
            runner: '["self-hosted", "macOS", "ARM64", "studio"]'
            features: "--features vendored-openssl"
          - variant: rocksdb
            target: aarch64-apple-darwin
            platform: darwin_arm64
            runner: '["self-hosted", "macOS", "ARM64", "studio"]'
            features: ""
          # redb
          - variant: redb
            target: x86_64-unknown-linux-gnu
            platform: linux_amd64
            runner: '["self-hosted", "Linux", "X64"]'
            features: "--features redb"
          - variant: redb
            target: aarch64-unknown-linux-gnu
            platform: linux_arm64
            runner: '["self-hosted", "Linux", "ARM64"]'
            features: "--features redb"
          - variant: redb
            target: x86_64-apple-darwin
            platform: darwin_amd64
            runner: '["self-hosted", "macOS", "ARM64", "studio"]'
            features: "--features redb,vendored-openssl"
          - variant: redb
            target: aarch64-apple-darwin
            platform: darwin_arm64
            runner: '["self-hosted", "macOS", "ARM64", "studio"]'
            features: "--features redb"
    steps:
      - uses: actions/checkout@v4

      - name: Configure private repo access
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-release"
          shared-key: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          NEEDS_APT=0
          if ! command -v pkg-config >/dev/null 2>&1; then
            NEEDS_APT=1
          elif ! pkg-config --exists openssl dbus-1; then
            NEEDS_APT=1
          fi
          if ! command -v protoc >/dev/null 2>&1; then
            NEEDS_APT=1
          fi
          if [ "${{ matrix.variant }}" = "rocksdb" ] && ! command -v clang >/dev/null 2>&1; then
            NEEDS_APT=1
          fi

          if [ "$NEEDS_APT" -eq 0 ]; then
            echo "Linux build dependencies already installed; skipping apt."
            exit 0
          fi

          APT_ARGS=()
          if [ "$(dpkg --print-architecture)" = "arm64" ]; then
            APT_ARGS=(-o APT::Architecture=arm64 -o APT::Architectures=arm64)
          fi

          sudo apt-get "${APT_ARGS[@]}" update
          sudo apt-get "${APT_ARGS[@]}" install -y libssl-dev pkg-config protobuf-compiler libdbus-1-dev
          if [ "${{ matrix.variant }}" = "rocksdb" ]; then
            sudo apt-get "${APT_ARGS[@]}" install -y libclang-dev
          fi

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Exclude workspace members with private deps
        run: |
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' '/"tools\/integration-test"/d; /"tools\/ffi-test"/d; /"proofs"/d' Cargo.toml
          else
            sed -i '/"tools\/integration-test"/d; /"tools\/ffi-test"/d; /"proofs"/d' Cargo.toml
          fi

      - name: Build
        run: cargo build --release -p cli --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ matrix.variant }}" = "rocksdb" ]; then
            ARCHIVE="defra_${TAG}_${{ matrix.platform }}.tar.gz"
          else
            ARCHIVE="defra-${{ matrix.variant }}_${TAG}_${{ matrix.platform }}.tar.gz"
          fi
          tar czf "${ARCHIVE}" -C "target/${{ matrix.target }}/release" defra
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: defra-${{ matrix.variant }}-${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}

      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true
          git checkout -- .
          git clean -fd

  build-wasm:
    name: Build WASM
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Configure private repo access
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-release"
          shared-key: "wasm32"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Exclude workspace members with private deps
        run: sed -i '/"tools\/integration-test"/d; /"tools\/ffi-test"/d; /"proofs"/d' Cargo.toml

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        run: wasm-pack build crates/wasm --release --target web --out-dir ../../pkg/wasm

      - name: Package
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="defra-wasm_${TAG}.tar.gz"
          tar czf "${ARCHIVE}" -C pkg/wasm defra_wasm_bg.wasm defra_wasm.js defra_wasm.d.ts
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: defra-wasm
          path: ${{ env.ARCHIVE }}

      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true
          git checkout -- .
          git clean -fd

  build-ffi:
    name: FFI ${{ matrix.variant }} (${{ matrix.platform }})
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # redb (default)
          - variant: redb
            target: x86_64-unknown-linux-gnu
            platform: linux_amd64
            runner: '["self-hosted", "Linux", "X64"]'
            features: "--features iroh"
          - variant: redb
            target: aarch64-unknown-linux-gnu
            platform: linux_arm64
            runner: '["self-hosted", "Linux", "ARM64"]'
            features: "--features iroh"
          - variant: redb
            target: x86_64-apple-darwin
            platform: darwin_amd64
            runner: '["self-hosted", "macOS", "ARM64", "studio"]'
            features: "--features iroh"
          - variant: redb
            target: aarch64-apple-darwin
            platform: darwin_arm64
            runner: '["self-hosted", "macOS", "ARM64", "studio"]'
            features: "--features iroh"
          # rocksdb
          - variant: rocksdb
            target: x86_64-unknown-linux-gnu
            platform: linux_amd64
            runner: '["self-hosted", "Linux", "X64"]'
            features: "--features rocksdb,iroh"
          - variant: rocksdb
            target: aarch64-unknown-linux-gnu
            platform: linux_arm64
            runner: '["self-hosted", "Linux", "ARM64"]'
            features: "--features rocksdb,iroh"
          - variant: rocksdb
            target: x86_64-apple-darwin
            platform: darwin_amd64
            runner: '["self-hosted", "macOS", "ARM64", "studio"]'
            features: "--features rocksdb,iroh"
          - variant: rocksdb
            target: aarch64-apple-darwin
            platform: darwin_arm64
            runner: '["self-hosted", "macOS", "ARM64", "studio"]'
            features: "--features rocksdb,iroh"
    steps:
      - uses: actions/checkout@v4

      - name: Configure private repo access
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-ffi"
          shared-key: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          NEEDS_APT=0
          if ! command -v pkg-config >/dev/null 2>&1; then
            NEEDS_APT=1
          elif ! pkg-config --exists openssl dbus-1; then
            NEEDS_APT=1
          fi
          if ! command -v protoc >/dev/null 2>&1; then
            NEEDS_APT=1
          fi
          if [ "${{ matrix.variant }}" = "rocksdb" ] && ! command -v clang >/dev/null 2>&1; then
            NEEDS_APT=1
          fi

          if [ "$NEEDS_APT" -eq 0 ]; then
            echo "Linux build dependencies already installed; skipping apt."
            exit 0
          fi

          APT_ARGS=()
          if [ "$(dpkg --print-architecture)" = "arm64" ]; then
            APT_ARGS=(-o APT::Architecture=arm64 -o APT::Architectures=arm64)
          fi

          sudo apt-get "${APT_ARGS[@]}" update
          sudo apt-get "${APT_ARGS[@]}" install -y libssl-dev pkg-config protobuf-compiler libdbus-1-dev
          if [ "${{ matrix.variant }}" = "rocksdb" ]; then
            sudo apt-get "${APT_ARGS[@]}" install -y libclang-dev
          fi

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Exclude workspace members with private deps
        run: |
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' '/"tools\/integration-test"/d; /"tools\/ffi-test"/d; /"proofs"/d' Cargo.toml
          else
            sed -i '/"tools\/integration-test"/d; /"tools\/ffi-test"/d; /"proofs"/d' Cargo.toml
          fi

      - name: Install cbindgen
        run: cargo install cbindgen

      - name: Build FFI
        run: cargo build --release -p ffi --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Generate header
        run: cbindgen --config crates/ffi/cbindgen.toml --crate ffi --output defra.h

      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="defra-ffi-${{ matrix.variant }}_${TAG}_${{ matrix.platform }}.tar.gz"
          tar czf "${ARCHIVE}" \
            -C "target/${{ matrix.target }}/release" libffi.a \
            -C "${GITHUB_WORKSPACE}" defra.h
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: defra-ffi-${{ matrix.variant }}-${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}

      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true
          git checkout -- .
          git clean -fd

  build-apple-ffi:
    name: FFI iOS XCFramework
    runs-on: ["self-hosted", "macOS", "ARM64", "studio"]
    steps:
      - uses: actions/checkout@v4

      - name: Configure private repo access
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-apple-ffi"
          shared-key: "ios"

      - name: Install system dependencies
        run: brew install protobuf

      - name: Exclude workspace members with private deps
        run: sed -i '' '/"tools\/integration-test"/d; /"tools\/ffi-test"/d; /"proofs"/d' Cargo.toml

      - name: Install cbindgen
        run: cargo install cbindgen

      - name: Build Apple FFI
        env:
          FEATURES: redb,iroh,native
          NO_DEFAULT_FEATURES: "1"
          OUT_DIR: ${{ github.workspace }}/target/apple-ffi
        run: |
          if command -v protoc >/dev/null 2>&1; then
            export PROTOC="$(command -v protoc)"
          fi
          tools/apple/build-ffi.sh

      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="defra-ffi-iroh_${TAG}_ios_xcframework.tar.gz"
          tar czf "${ARCHIVE}" -C target/apple-ffi include lib xcframework swift
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: defra-ffi-iroh-ios_xcframework
          path: ${{ env.ARCHIVE }}

      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true
          git checkout -- .
          git clean -fd

  docker:
    name: Docker
    needs: build
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: defra-rocksdb-linux_amd64
          path: docker-context/linux/amd64

      - uses: actions/download-artifact@v4
        with:
          name: defra-rocksdb-linux_arm64
          path: docker-context/linux/arm64

      - name: Extract binaries
        run: |
          cd docker-context/linux/amd64 && tar xzf *.tar.gz && rm *.tar.gz
          cd ../arm64 && tar xzf *.tar.gz && rm *.tar.gz

      - uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sourcenetwork/defradb-rs:${{ github.ref_name }}
            ghcr.io/sourcenetwork/defradb-rs:latest

  release:
    name: Release
    needs: [build, build-ffi, build-apple-ffi, build-wasm, docker]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs['build-ffi'].result == 'success' &&
      needs['build-apple-ffi'].result == 'success' &&
      needs['build-wasm'].result == 'success' &&
      needs.docker.result == 'success'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: defra-redb-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: defra-rocksdb-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: defra-ffi-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: defra-wasm
          merge-multiple: true

      - name: List release artifacts
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
