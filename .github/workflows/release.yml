name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.variant }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # redb (default storage backend)
          - variant: redb
            target: x86_64-unknown-linux-gnu
            platform: linux_amd64
            runner: ubuntu-latest
            features: ""
          - variant: redb
            target: aarch64-unknown-linux-gnu
            platform: linux_arm64
            runner: ubuntu-24.04-arm
            features: ""
          - variant: redb
            target: x86_64-apple-darwin
            platform: darwin_amd64
            runner: macos-14
            features: "--features vendored-openssl"
          - variant: redb
            target: aarch64-apple-darwin
            platform: darwin_arm64
            runner: macos-latest
            features: ""
          # fjall
          - variant: fjall
            target: x86_64-unknown-linux-gnu
            platform: linux_amd64
            runner: ubuntu-latest
            features: "--features fjall"
          - variant: fjall
            target: aarch64-unknown-linux-gnu
            platform: linux_arm64
            runner: ubuntu-24.04-arm
            features: "--features fjall"
          - variant: fjall
            target: x86_64-apple-darwin
            platform: darwin_amd64
            runner: macos-14
            features: "--features fjall,vendored-openssl"
          - variant: fjall
            target: aarch64-apple-darwin
            platform: darwin_arm64
            runner: macos-latest
            features: "--features fjall"
          # rocksdb
          - variant: rocksdb
            target: x86_64-unknown-linux-gnu
            platform: linux_amd64
            runner: ubuntu-latest
            features: "--features rocksdb"
          - variant: rocksdb
            target: aarch64-unknown-linux-gnu
            platform: linux_arm64
            runner: ubuntu-24.04-arm
            features: "--features rocksdb"
          - variant: rocksdb
            target: x86_64-apple-darwin
            platform: darwin_amd64
            runner: macos-14
            features: "--features rocksdb,vendored-openssl"
          - variant: rocksdb
            target: aarch64-apple-darwin
            platform: darwin_arm64
            runner: macos-latest
            features: "--features rocksdb"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-release"
          shared-key: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler libdbus-1-dev
          if [ "${{ matrix.variant }}" = "rocksdb" ]; then
            sudo apt-get install -y libclang-dev
          fi

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Exclude tools with private deps from workspace
        run: |
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' '/"tools\/integration-test"/d; /"tools\/ffi-test"/d' Cargo.toml
          else
            sed -i '/"tools\/integration-test"/d; /"tools\/ffi-test"/d' Cargo.toml
          fi

      - name: Build
        run: cargo build --release -p cli --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ matrix.variant }}" = "redb" ]; then
            ARCHIVE="defra_${TAG}_${{ matrix.platform }}.tar.gz"
          else
            ARCHIVE="defra-${{ matrix.variant }}_${TAG}_${{ matrix.platform }}.tar.gz"
          fi
          tar czf "${ARCHIVE}" -C "target/${{ matrix.target }}/release" defra
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: defra-${{ matrix.variant }}-${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-release"
          shared-key: "wasm32"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Exclude tools with private deps from workspace
        run: sed -i '/"tools\/integration-test"/d; /"tools\/ffi-test"/d' Cargo.toml

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        run: wasm-pack build crates/wasm --release --target web --out-dir ../../pkg/wasm

      - name: Package
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="defra-wasm_${TAG}.tar.gz"
          tar czf "${ARCHIVE}" -C pkg/wasm defra_wasm_bg.wasm defra_wasm.js defra_wasm.d.ts
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: defra-wasm
          path: ${{ env.ARCHIVE }}

  build-ffi:
    name: FFI ${{ matrix.variant }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # redb (default)
          - variant: redb
            target: x86_64-unknown-linux-gnu
            platform: linux_amd64
            runner: ubuntu-latest
            features: ""
          - variant: redb
            target: aarch64-unknown-linux-gnu
            platform: linux_arm64
            runner: ubuntu-24.04-arm
            features: ""
          - variant: redb
            target: x86_64-apple-darwin
            platform: darwin_amd64
            runner: macos-14
            features: ""
          - variant: redb
            target: aarch64-apple-darwin
            platform: darwin_arm64
            runner: macos-latest
            features: ""
          # fjall
          - variant: fjall
            target: x86_64-unknown-linux-gnu
            platform: linux_amd64
            runner: ubuntu-latest
            features: "--features fjall"
          - variant: fjall
            target: aarch64-unknown-linux-gnu
            platform: linux_arm64
            runner: ubuntu-24.04-arm
            features: "--features fjall"
          - variant: fjall
            target: x86_64-apple-darwin
            platform: darwin_amd64
            runner: macos-14
            features: "--features fjall"
          - variant: fjall
            target: aarch64-apple-darwin
            platform: darwin_arm64
            runner: macos-latest
            features: "--features fjall"
          # rocksdb
          - variant: rocksdb
            target: x86_64-unknown-linux-gnu
            platform: linux_amd64
            runner: ubuntu-latest
            features: "--features rocksdb"
          - variant: rocksdb
            target: aarch64-unknown-linux-gnu
            platform: linux_arm64
            runner: ubuntu-24.04-arm
            features: "--features rocksdb"
          - variant: rocksdb
            target: x86_64-apple-darwin
            platform: darwin_amd64
            runner: macos-14
            features: "--features rocksdb"
          - variant: rocksdb
            target: aarch64-apple-darwin
            platform: darwin_arm64
            runner: macos-latest
            features: "--features rocksdb"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-ffi"
          shared-key: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler libdbus-1-dev
          if [ "${{ matrix.variant }}" = "rocksdb" ]; then
            sudo apt-get install -y libclang-dev
          fi

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Exclude tools with private deps from workspace
        run: |
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' '/"tools\/integration-test"/d; /"tools\/ffi-test"/d' Cargo.toml
          else
            sed -i '/"tools\/integration-test"/d; /"tools\/ffi-test"/d' Cargo.toml
          fi

      - name: Install cbindgen
        run: cargo install cbindgen

      - name: Build FFI
        run: cargo build --release -p ffi --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Generate header
        run: cbindgen --config crates/ffi/cbindgen.toml --crate ffi --output defra.h

      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="defra-ffi-${{ matrix.variant }}_${TAG}_${{ matrix.platform }}.tar.gz"
          tar czf "${ARCHIVE}" \
            -C "target/${{ matrix.target }}/release" libffi.a \
            -C "${GITHUB_WORKSPACE}" defra.h
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: defra-ffi-${{ matrix.variant }}-${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}

  docker:
    name: Docker
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: defra-redb-linux_amd64
          path: docker-context/linux/amd64

      - uses: actions/download-artifact@v4
        with:
          name: defra-redb-linux_arm64
          path: docker-context/linux/arm64

      - name: Extract binaries
        run: |
          cd docker-context/linux/amd64 && tar xzf *.tar.gz && rm *.tar.gz
          cd ../arm64 && tar xzf *.tar.gz && rm *.tar.gz

      - uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jackzampolin/defradb-rs:${{ github.ref_name }}
            ghcr.io/jackzampolin/defradb-rs:latest

  release:
    name: Release
    needs: [build, build-ffi, build-wasm, docker]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: defra-redb-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: defra-fjall-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: defra-rocksdb-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: defra-ffi-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: defra-wasm
          merge-multiple: true

      - name: List release artifacts
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
