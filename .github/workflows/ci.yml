name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  PROTOC: /opt/homebrew/bin/protoc

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, macOS, ARM64, studio]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Configure private repo access
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo fmt --all -- --check

      - run: cargo clippy --all -- -D warnings

      # OTel feature paths are opt-in (mirror Go's `//go:build telemetry`),
      # so the default clippy pass doesn't exercise them. These checks keep
      # the feature-gated code from rotting silently. The `metrics` feature
      # gates a whole separate code path (meter provider, metric exporter)
      # that no other job builds. Issue #977.
      - run: cargo clippy -p telemetry --features otlp --all-targets -- -D warnings
      - run: cargo clippy -p telemetry --features metrics --all-targets -- -D warnings
      - run: cargo clippy -p cli --features otel --all-targets -- -D warnings
      - run: cargo clippy -p defra-node --features otel --all-targets -- -D warnings

      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true

  wasm-check:
    name: WASM Build Check
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Configure private repo access
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-ci"
          shared-key: "wasm32"

      - name: Install system dependencies
        # clang is needed because lz4-sys (transitive C dep) builds
        # wasm-shim C sources via cc-rs when the target is wasm32.
        # protoc is needed by prost-build.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang

      - name: Exclude tools with private deps from workspace
        run: sed -i '/"tools\/integration-test"/d; /"tools\/ffi-test"/d' Cargo.toml

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM
        run: wasm-pack build crates/wasm --release --target web --out-dir ../../pkg/wasm

      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true
          git checkout -- Cargo.toml

  build:
    name: Build & Test
    runs-on: [self-hosted, macOS, ARM64, studio]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Configure private repo access
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test --workspace --exclude integration-test --exclude ffi-test --exclude conformance

      # Cache binaries BEFORE any feature-on rebuild. `cargo test --workspace`
      # above left a default-feature `defra` at target/debug/defra; the otel
      # steps below recompile it with `--features otel`, so caching must happen
      # first or the integration matrix would restore a telemetry-enabled
      # binary as its "standard" defra.
      - name: Cache pre-built binaries
        run: |
          HASH=$(git rev-parse HEAD)
          CACHE_DIR="$HOME/.sourcenetwork/bin/defradb.rs/$HASH"
          mkdir -p "$CACHE_DIR"

          # Standard (default-feature) binary — compiled by cargo test above.
          cp target/debug/defra "$CACHE_DIR/defra"

          # Iroh binary — needs feature build
          cargo build -p cli --features iroh
          cp target/debug/defra "$CACHE_DIR/defra-iroh"

          # Symlink for backbone CI consumption
          ln -sf "$CACHE_DIR/defra-iroh" "$HOME/.sourcenetwork/bin/defra-iroh"

      # OTel-only tests, run AFTER caching so the otel rebuild of target/debug/defra
      # never pollutes the cached standard binary. The `metrics` build keeps the
      # metric-exporter path compiling; the cli otel test spawns a real node
      # against an unreachable collector and asserts the dedup hint fires exactly
      # once — the Docker-free regression guard for the SDK's `internal-logs`
      # feature. Issue #977 / #1004.
      - run: cargo test -p telemetry --features otlp
      - run: cargo test -p telemetry --features metrics
      - run: cargo test -p cli --features otel --test telemetry_dedup

      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true
          git checkout -- .
          git clean -fd
          pkill -f "target/debug/defra" || true

  conformance:
    name: Conformance
    # Serialized after `integration` (not just `build`) so it never co-runs
    # with the integration matrix on the single studio host. Both jobs spawn
    # real `defra` nodes and the studio harness port allocator has a TOCTOU
    # bind race ("failed to start rust-0") when node-spawning jobs run
    # concurrently — the same reason the integration matrix pins
    # `max-parallel: 1`. The dependency edge is the strict-ordering fix; it
    # does not affect correctness, only scheduling.
    needs: [build, integration]
    runs-on: [self-hosted, macOS, ARM64, studio]
    timeout-minutes: 45
    env:
      DEFRA_CONFORMANCE_BINARY: ${{ github.workspace }}/target/release/defra
      DEFRA_WORKSPACE_ROOT: ${{ github.workspace }}
      # The conformance harness waits on INFO-level node readiness/P2P log lines.
      # Pin the child-node filter so an inherited runner-level RUST_LOG=warn
      # cannot make healthy nodes look unready.
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Configure private repo access
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary under test
        run: |
          cargo build --release -p cli
          "$DEFRA_CONFORMANCE_BINARY" version --format json

      # The conformance crate (proofs/) drives real `defra` subprocesses. Run it
      # serially so concurrent node startup doesn't contend on ports/CPU and
      # flake ("failed to start rust-0"). The Lean drift-check still skips when
      # `lake` is absent; a Lean-equipped job can make that mandatory later.
      - name: Run conformance tests
        run: cargo test -p conformance -- --test-threads=1

      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true
          git checkout -- .
          git clean -fd
          pkill -f "target/release/defra" || true
          pkill -f "target/debug/defra" || true

  integration:
    name: Integration (${{ matrix.suite }})
    needs: build
    runs-on: [self-hosted, macOS, ARM64, studio]
    strategy:
      fail-fast: false
      # The harness still allocates localhost ports via a release-then-spawn
      # sequence, so matrix fan-out multiplies bind races on the same studio
      # host. Keep integration suites single-file until the allocator is fixed.
      max-parallel: 1
      matrix:
        include:
          - suite: rust
            needs_go: false
          - suite: go-compat
            needs_go: true
          - suite: iroh
            needs_go: false
          # #978: re-run the rust integration suite with
          # DEFRA_MULTIPLIERS=signed-docs so every cluster gets
          # .with_signing() auto-applied. Catches regressions in
          # unrelated features that only surface when blocks carry
          # Signature links (mirrors Go DefraDB PR #4746). Non-blocking
          # until in-tree .no_signing_multiplier() opt-outs land for
          # known-incompatible tests; flip continue_on_error to false
          # once the suite is green.
          - suite: signed-docs
            needs_go: false
            multipliers: signed-docs
            continue_on_error: true
    continue-on-error: ${{ matrix.continue_on_error == true }}
    env:
      DEFRA_RUST_BINARY: ${{ github.workspace }}/target/ci/defra
      DEFRA_IROH_BINARY: ${{ github.workspace }}/target/ci/defra-iroh
      DEFRA_MULTIPLIERS: ${{ matrix.multipliers || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Configure private repo access
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"

      - uses: dtolnay/rust-toolchain@stable

      - name: Restore or build binaries
        run: |
          HASH=$(git rev-parse HEAD)
          CACHE_DIR="$HOME/.sourcenetwork/bin/defradb.rs/$HASH"
          mkdir -p target/ci

          if [ -f "$CACHE_DIR/defra" ] && [ -f "$CACHE_DIR/defra-iroh" ]; then
            echo "Cache hit — restoring from $CACHE_DIR"
            cp "$CACHE_DIR/defra" target/ci/defra
            cp "$CACHE_DIR/defra-iroh" target/ci/defra-iroh
          else
            echo "Cache miss — building binaries"
            cargo build -p cli
            cp target/debug/defra target/ci/defra
            cargo build -p cli --features iroh
            cp target/debug/defra target/ci/defra-iroh
          fi

          chmod +x target/ci/defra target/ci/defra-iroh
          target/ci/defra version --format json

      - name: Install Go toolchain
        if: matrix.suite == 'go-compat'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Prepare Go DefraDB binary
        if: matrix.needs_go
        run: |
          GO_REF=$(grep 'pub const GO_COMPAT_COMMIT' crates/defra-version/src/lib.rs | sed "s/.*\"\(.*\)\".*/\1/")
          GO_BRANCH=$(grep 'pub const GO_COMPAT_BRANCH' crates/defra-version/src/lib.rs | sed "s/.*\"\(.*\)\".*/\1/")
          GO_TAG=$(grep 'pub const GO_COMPAT_TAG' crates/defra-version/src/lib.rs | sed "s/.*\"\(.*\)\".*/\1/")

          if [ -n "$GO_TAG" ]; then
            VER_NUM="${GO_TAG#v}"
            ASSET="defradb_${VER_NUM}_darwin_arm64"
            URL="https://github.com/sourcenetwork/defradb/releases/download/${GO_TAG}/${ASSET}"
            CACHE_DIR="$HOME/.cache/defra-harness/${GO_TAG}"
            mkdir -p "$CACHE_DIR"
            if [ ! -x "$CACHE_DIR/defradb" ]; then
              echo "Downloading Go DefraDB ${GO_TAG}..."
              curl -fSL -o "$CACHE_DIR/defradb" "$URL"
              chmod +x "$CACHE_DIR/defradb"
            fi
          else
            if [ -z "$GO_REF" ]; then
              echo "::error::GO_COMPAT_COMMIT is empty in crates/defra-version/src/lib.rs"
              exit 1
            fi
            if [ -z "$GO_BRANCH" ]; then
              echo "::error::GO_COMPAT_BRANCH is empty in crates/defra-version/src/lib.rs"
              exit 1
            fi

            CACHE_DIR="$HOME/.cache/defra-harness/${GO_REF}"
            mkdir -p "$CACHE_DIR"
            if [ ! -x "$CACHE_DIR/defradb" ]; then
              echo "Building Go DefraDB ${GO_REF} from ${GO_BRANCH}..."
              WORK_DIR="$RUNNER_TEMP/defradb-${GO_REF}"
              rm -rf "$WORK_DIR"
              git clone --filter=blob:none --branch "$GO_BRANCH" https://github.com/sourcenetwork/defradb "$WORK_DIR"
              git -C "$WORK_DIR" checkout "$GO_REF"
              make -C "$WORK_DIR" build path="$CACHE_DIR/defradb"
              chmod +x "$CACHE_DIR/defradb"
            fi
          fi

          echo "$CACHE_DIR" >> "$GITHUB_PATH"
          "$CACHE_DIR/defradb" version --format json

      # Guards against silent drift between the committed Go-parity hex
      # constants in `crates/p2p/src/**` and what upstream Go actually
      # emits. Both generators print hex to stdout (no files written);
      # every `(N bytes): <hex>` or `(N): <hex>` line is checked against
      # the Rust source tree. If upstream reorders a struct field the
      # hex changes, the grep misses, and the job fails — instead of
      # Rust tests passing against stale constants.
      - name: Verify Go fixtures still match Rust constants
        if: matrix.suite == 'go-compat'
        run: |
          set -euo pipefail
          OUT=$(mktemp)
          # Each generator has its own go.mod; `go run <path>/main.go`
          # uses single-file mode and ignores it, so cd into each module.
          (cd crates/p2p/testdata/gen_message_fixtures   && go run .) >> "$OUT"
          (cd crates/p2p/testdata/gen_pubsub_rpc_fixture && go run .) >> "$OUT"
          # Extract every hex token emitted after a "(N bytes): " or
          # "(N): " marker. Lowercase hex, length >= 4.
          HEXES=$(grep -Eo '\(([0-9]+)( bytes)?\): [0-9a-f]+' "$OUT" | awk '{print $NF}')
          if [ -z "$HEXES" ]; then
            echo "::error::no hex fixtures extracted from generator output" >&2
            cat "$OUT" >&2
            exit 1
          fi
          STALE=0
          while IFS= read -r H; do
            if ! grep -qR --include='*.rs' -F "$H" crates/p2p/src/; then
              echo "::error::Go fixture hex not found in crates/p2p/src/**: $H" >&2
              STALE=1
            fi
          done <<< "$HEXES"
          if [ "$STALE" -ne 0 ]; then
            echo "::error::Go fixture drift detected — regenerate Rust constants by running the generators locally and updating crates/p2p/src/message/pubsub.rs, crates/p2p/src/pubsub_rpc/envelope.rs, and crates/p2p/src/sync/coordinator/pubsub_services.rs" >&2
            exit 1
          fi

      # `basic` is serialized because its tests start rust nodes and the
      # harness port allocator (`defra-harness::ports`) has a TOCTOU race
      # between dropping the port guard listener and the child process
      # binding. Under high parallelism the race triggers EADDRINUSE.
      # Track the underlying harness fix in the backbone repo; this flag
      # is the tactical mitigation.
      - name: Run rust integration tests (serialized — port race)
        if: matrix.suite == 'rust' || matrix.suite == 'signed-docs'
        run: >-
          cargo test -p integration-test
          --test basic
          -- --test-threads=1 --skip ::go_

      - name: Run rust integration tests (serialized — port race)
        if: matrix.suite == 'rust' || matrix.suite == 'signed-docs'
        run: >-
          cargo test -p integration-test
          --test query --test acp --test nac
          --test encryption --test identity
          --test backup --test fts
          -- --test-threads=1 --skip ::go_

      - name: Run rust P2P integration tests
        if: matrix.suite == 'rust' || matrix.suite == 'signed-docs'
        run: >-
          cargo test -p integration-test
          --test p2p
          -- --test-threads=1 --skip ::go_

      # go-compat runs the `go_*` half of every dual-runtime test against
      # the upstream Go DefraDB binary. Catches cross-implementation
      # regressions at PR time. The binary is selected by GO_COMPAT_TAG
      # when a release exists, otherwise it is built from GO_COMPAT_COMMIT.
      #
      # The 5 `link_collection::go_acp_link_collection_*_reject` tests
      # cover #746 (Rust schema loader silently accepts invalid DRIs).
      # They will pass on Go but fail on the divergence-guard form
      # currently on main. Once #756 lands, those tests are flipped to
      # positive assertions and the skip filters below should be removed.
      - name: Run go-compat integration tests
        if: matrix.suite == 'go-compat'
        run: >-
          cargo test -p integration-test
          --test basic --test query --test acp --test nac --test backup --test p2p
          -- --test-threads=1 go_
          --skip go_acp_link_collection_nonexistent_policy_reject
          --skip go_acp_link_collection_nonexistent_resource_reject
          --skip go_acp_link_collection_missing_read_perm_reject
          --skip go_acp_link_collection_missing_update_perm_reject
          --skip go_acp_link_collection_missing_delete_perm_reject

      - name: Run iroh integration tests
        if: matrix.suite == 'iroh'
        run: >-
          cargo test -p integration-test
          --test p2p_iroh
          -- --test-threads=1 connection::

      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true
          git checkout -- .
          git clean -fd
          pkill -f "target/(debug|ci)/defra" || true

  artifacts:
    name: Release Artifacts
    runs-on: [self-hosted, macOS, ARM64, studio]
    needs: [build]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Configure private repo access
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: |
          cargo build --release -p cli
          mkdir -p artifacts
          cp target/release/defra artifacts/defra
          cargo build --release -p cli --features iroh
          cp target/release/defra artifacts/defra-iroh

      - name: Upload defra
        uses: actions/upload-artifact@v4
        with:
          name: defra-aarch64-apple-darwin
          path: artifacts/defra
          retention-days: 30

      - name: Upload defra-iroh
        uses: actions/upload-artifact@v4
        with:
          name: defra-iroh-aarch64-apple-darwin
          path: artifacts/defra-iroh
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true
          git checkout -- .
          git clean -fd
