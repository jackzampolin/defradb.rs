name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  PROTOC: /opt/homebrew/bin/protoc

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, macOS, ARM64, studio]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Configure private repo access
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo fmt --all -- --check

      - run: cargo clippy --all -- -D warnings

      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true

  wasm-check:
    name: WASM Build Check
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Configure private repo access
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-ci"
          shared-key: "wasm32"

      - name: Install system dependencies
        # clang is needed because lz4-sys (transitive C dep) builds
        # wasm-shim C sources via cc-rs when the target is wasm32.
        # protoc is needed by prost-build.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang

      - name: Exclude tools with private deps from workspace
        run: sed -i '/"tools\/integration-test"/d; /"tools\/ffi-test"/d' Cargo.toml

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM
        run: wasm-pack build crates/wasm --release --target web --out-dir ../../pkg/wasm

      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true
          git checkout -- Cargo.toml

  build:
    name: Build & Test
    runs-on: [self-hosted, macOS, ARM64, studio]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Configure private repo access
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test --workspace --exclude integration-test --exclude ffi-test

      - name: Cache pre-built binaries
        run: |
          HASH=$(git rev-parse HEAD)
          CACHE_DIR="$HOME/.sourcenetwork/bin/defradb.rs/$HASH"
          mkdir -p "$CACHE_DIR"

          # Standard binary — already compiled by cargo test, just link
          cp target/debug/defra "$CACHE_DIR/defra"

          # Iroh binary — needs feature build
          cargo build -p cli --features iroh
          cp target/debug/defra "$CACHE_DIR/defra-iroh"

          # Symlink for backbone CI consumption
          ln -sf "$CACHE_DIR/defra-iroh" "$HOME/.sourcenetwork/bin/defra-iroh"

      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true
          git checkout -- .
          git clean -fd
          pkill -f "target/debug/defra" || true

  integration:
    name: Integration (${{ matrix.suite }})
    needs: build
    runs-on: [self-hosted, macOS, ARM64, studio]
    strategy:
      fail-fast: false
      # The harness still allocates localhost ports via a release-then-spawn
      # sequence, so matrix fan-out multiplies bind races on the same studio
      # host. Keep integration suites single-file until the allocator is fixed.
      max-parallel: 1
      matrix:
        include:
          - suite: rust
            needs_go: false
          - suite: go-compat
            needs_go: true
          - suite: iroh
            needs_go: false
    env:
      DEFRA_RUST_BINARY: ${{ github.workspace }}/target/ci/defra
      DEFRA_IROH_BINARY: ${{ github.workspace }}/target/ci/defra-iroh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Configure private repo access
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"

      - uses: dtolnay/rust-toolchain@stable

      - name: Restore or build binaries
        run: |
          HASH=$(git rev-parse HEAD)
          CACHE_DIR="$HOME/.sourcenetwork/bin/defradb.rs/$HASH"
          mkdir -p target/ci

          if [ -f "$CACHE_DIR/defra" ] && [ -f "$CACHE_DIR/defra-iroh" ]; then
            echo "Cache hit — restoring from $CACHE_DIR"
            cp "$CACHE_DIR/defra" target/ci/defra
            cp "$CACHE_DIR/defra-iroh" target/ci/defra-iroh
          else
            echo "Cache miss — building binaries"
            cargo build -p cli
            cp target/debug/defra target/ci/defra
            cargo build -p cli --features iroh
            cp target/debug/defra target/ci/defra-iroh
          fi

          chmod +x target/ci/defra target/ci/defra-iroh
          target/ci/defra version --format json

      - name: Download Go DefraDB binary
        if: matrix.needs_go
        run: |
          GO_TAG=$(grep 'pub const GO_COMPAT_TAG' crates/defra-version/src/lib.rs | sed "s/.*\"\(.*\)\".*/\1/")
          if [ -z "$GO_TAG" ]; then
            echo "::error::GO_COMPAT_TAG is empty in crates/defra-version/src/lib.rs"
            exit 1
          fi
          VER_NUM="${GO_TAG#v}"
          ASSET="defradb_${VER_NUM}_darwin_arm64"
          URL="https://github.com/sourcenetwork/defradb/releases/download/${GO_TAG}/${ASSET}"
          CACHE_DIR="$HOME/.cache/defra-harness/${GO_TAG}"
          mkdir -p "$CACHE_DIR"
          if [ ! -x "$CACHE_DIR/defradb" ]; then
            echo "Downloading Go DefraDB ${GO_TAG}..."
            curl -fSL -o "$CACHE_DIR/defradb" "$URL"
            chmod +x "$CACHE_DIR/defradb"
          fi
          echo "$CACHE_DIR" >> "$GITHUB_PATH"
          "$CACHE_DIR/defradb" version --format json

      # The self-hosted macOS ARM64 runner ships without a Go toolchain —
      # the `go-compat` suite normally uses a prebuilt defradb binary.
      # The fixture drift step below needs `go run`, so install Go on
      # demand for that suite only.
      - name: Install Go toolchain (fixture drift guard only)
        if: matrix.suite == 'go-compat'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Guards against silent drift between the committed Go-parity hex
      # constants in `crates/p2p/src/**` and what upstream Go actually
      # emits. Both generators print hex to stdout (no files written);
      # every `(N bytes): <hex>` or `(N): <hex>` line is checked against
      # the Rust source tree. If upstream reorders a struct field the
      # hex changes, the grep misses, and the job fails — instead of
      # Rust tests passing against stale constants.
      - name: Verify Go fixtures still match Rust constants
        if: matrix.suite == 'go-compat'
        run: |
          set -euo pipefail
          OUT=$(mktemp)
          # Each generator has its own go.mod; `go run <path>/main.go`
          # uses single-file mode and ignores it, so cd into each module.
          (cd crates/p2p/testdata/gen_message_fixtures   && go run .) >> "$OUT"
          (cd crates/p2p/testdata/gen_pubsub_rpc_fixture && go run .) >> "$OUT"
          # Extract every hex token emitted after a "(N bytes): " or
          # "(N): " marker. Lowercase hex, length >= 4.
          HEXES=$(grep -Eo '\(([0-9]+)( bytes)?\): [0-9a-f]+' "$OUT" | awk '{print $NF}')
          if [ -z "$HEXES" ]; then
            echo "::error::no hex fixtures extracted from generator output" >&2
            cat "$OUT" >&2
            exit 1
          fi
          STALE=0
          while IFS= read -r H; do
            if ! grep -qR --include='*.rs' -F "$H" crates/p2p/src/; then
              echo "::error::Go fixture hex not found in crates/p2p/src/**: $H" >&2
              STALE=1
            fi
          done <<< "$HEXES"
          if [ "$STALE" -ne 0 ]; then
            echo "::error::Go fixture drift detected — regenerate Rust constants by running the generators locally and updating crates/p2p/src/message/pubsub.rs, crates/p2p/src/pubsub_rpc/envelope.rs, and crates/p2p/src/sync/coordinator/pubsub_services.rs" >&2
            exit 1
          fi

      # `basic` is serialized because its tests start rust nodes and the
      # harness port allocator (`defra-harness::ports`) has a TOCTOU race
      # between dropping the port guard listener and the child process
      # binding. Under high parallelism the race triggers EADDRINUSE.
      # Track the underlying harness fix in the backbone repo; this flag
      # is the tactical mitigation.
      - name: Run rust integration tests (serialized — port race)
        if: matrix.suite == 'rust'
        run: >-
          cargo test -p integration-test
          --test basic
          -- --test-threads=1 --skip ::go_

      - name: Run rust integration tests (serialized — port race)
        if: matrix.suite == 'rust'
        run: >-
          cargo test -p integration-test
          --test query --test acp --test nac
          --test encryption --test identity
          --test backup --test fts
          -- --test-threads=1 --skip ::go_

      - name: Run rust P2P integration tests
        if: matrix.suite == 'rust'
        run: >-
          cargo test -p integration-test
          --test p2p
          -- --test-threads=1 --skip ::go_

      # go-compat runs the `go_*` half of every dual-runtime test against
      # the upstream Go DefraDB binary. Catches cross-implementation
      # regressions at PR time. Each binary added here was verified
      # against defradb commit d5a5a879 (2026-04-10) before landing.
      #
      # The 5 `link_collection::go_acp_link_collection_*_reject` tests
      # cover #746 (Rust schema loader silently accepts invalid DRIs).
      # They will pass on Go but fail on the divergence-guard form
      # currently on main. Once #756 lands, those tests are flipped to
      # positive assertions and the skip filters below should be removed.
      - name: Run go-compat integration tests
        if: matrix.suite == 'go-compat'
        run: >-
          cargo test -p integration-test
          --test basic --test query --test acp --test nac --test backup --test p2p
          -- --test-threads=1 go_
          --skip go_acp_link_collection_nonexistent_policy_reject
          --skip go_acp_link_collection_nonexistent_resource_reject
          --skip go_acp_link_collection_missing_read_perm_reject
          --skip go_acp_link_collection_missing_update_perm_reject
          --skip go_acp_link_collection_missing_delete_perm_reject

      - name: Run iroh integration tests
        if: matrix.suite == 'iroh'
        run: >-
          cargo test -p integration-test
          --test p2p_iroh
          -- --test-threads=1 connection::

      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true
          git checkout -- .
          git clean -fd
          pkill -f "target/(debug|ci)/defra" || true

  artifacts:
    name: Release Artifacts
    runs-on: [self-hosted, macOS, ARM64, studio]
    needs: [build]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Configure private repo access
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: |
          cargo build --release -p cli
          mkdir -p artifacts
          cp target/release/defra artifacts/defra
          cargo build --release -p cli --features iroh
          cp target/release/defra artifacts/defra-iroh

      - name: Upload defra
        uses: actions/upload-artifact@v4
        with:
          name: defra-aarch64-apple-darwin
          path: artifacts/defra
          retention-days: 30

      - name: Upload defra-iroh
        uses: actions/upload-artifact@v4
        with:
          name: defra-iroh-aarch64-apple-darwin
          path: artifacts/defra-iroh
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true
          git checkout -- .
          git clean -fd
