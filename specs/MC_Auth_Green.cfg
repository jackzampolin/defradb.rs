\* GREEN: all remote management mutations use strict actor-DID + NAC authorization.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Requests <- mcRequests
  Actors <- mcActors
  Permissions <- mcPermissions
  EntryPoints <- mcEntries
  EntryOf <- mcEntryOf
  PresentedActor <- mcPresentedActor
  RequiredPermission <- mcRequiredPermission
  InitialCredential <- mcInitialCredential
  InitialGrants <- mcInitialGrants
  MutableGrantPairs <- mcMutableGrantPairs
  GateByEntry <- mcGateByEntry
  EntryCanMutate <- mcEntryCanMutate
  AuthzMode = "Strict"
INVARIANT TypeOK
INVARIANT INV_NoMutationWithoutVerifiedActor
INVARIANT INV_NoStaleReplay
INVARIANT INV_PermissionScoped
INVARIANT INV_AllEntryPointsGated
