\* GREEN: immutable key (no owner rewrite) — INV_NoSplitOwnership expected to hold.
\* Twin of MC_S3.cfg; differs only in OwnerWrite + KeyMutability.
SPECIFICATION SpecS3
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- mcNodes
  DIDs <- mcDIDs
  DidOf <- mcDidOf
  Blocks <- mcBlocks
  Doc <- mcDoc
  Parents <- mcParents
  Heads <- mcHeads
  OwnerWrite <- mcOwnerWriteImmutable
  CreateOwner <- mcCreateOwner
  RelRef <- mcRelRef
  Creator = "src"
  FilterScope = "WholeDoc"
  KeyMutability = "Immutable"
  FetchPolicy = "FullWalkA"
INVARIANT TypeOK
INVARIANT INV_NoSplitOwnership
