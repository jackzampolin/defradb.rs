\* Model B: nr skips filtered x1f (treats it as placeholder) and merges x0 and x2
\* WITHOUT fetching x1f. Both INV_NoFilteredFetch and INV_VisibleConverge hold.
\* Note: INV_DagComplete is intentionally NOT checked — Model B merges across the
\* filtered parent, so strict DAG-completeness fails BY DESIGN (the Model-B trade-off).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- mcNodes
  DIDs <- mcDIDs
  DidOf <- mcDidOf
  Blocks <- mcBlocks
  Doc <- mcDoc
  Parents <- mcParents
  Heads <- mcHeads
  OwnerWrite <- mcOwnerWrite
  CreateOwner <- mcCreateOwner
  RelRef <- mcRelRef
  FilteredBlocks <- mcFiltered
  Creator = "nx"
  FilterScope = "SubDoc"
  KeyMutability = "Immutable"
  FetchPolicy = "FilteredMergeB"
INVARIANT TypeOK
INVARIANT INV_NoFilteredFetch
PROPERTY INV_VisibleConverge
