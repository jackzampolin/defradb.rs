\* FETCHED x1f, defeating resource savings. INV_NoFilteredFetch expected to FAIL
\* (the headline). VisibleConverge itself would hold; TLC stops at the invariant.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- mcNodes
  DIDs <- mcDIDs
  DidOf <- mcDidOf
  Blocks <- mcBlocks
  Doc <- mcDoc
  Parents <- mcParents
  Heads <- mcHeads
  OwnerWrite <- mcOwnerWrite
  CreateOwner <- mcCreateOwner
  RelRef <- mcRelRef
  FilteredBlocks <- mcFiltered
  Creator = "nx"
  FilterScope = "SubDoc"
  KeyMutability = "Immutable"
  FetchPolicy = "FullWalkA"
INVARIANT TypeOK
INVARIANT INV_NoFilteredFetch
PROPERTY INV_VisibleConverge
