\* GREEN: revocation/replay checked against current authorization at response time.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- mcNodes
  DIDs <- mcDIDs
  DidOf <- mcDidOf
  Keys <- mcKeys
  InitialAuthorized <- mcInitialAuthorized
  InitiallyHasKey <- mcInitiallyHasKey
  Requesters <- mcRequesters
  Grantable <- mcGrantable
  Revocable <- mcRevocable
  NetworkConnected = TRUE
  PolicyMode = "CurrentAuth"
  CryptoMode = "RecipientOnly"
INVARIANT TypeOK
INVARIANT INV_OnlyAuthorizedHasKey
INVARIANT INV_OnlyIntendedRecipientDecrypts
INVARIANT INV_RevokedCannotObtain
INVARIANT INV_NoReplayGrant
PROPERTY INV_AuthorizedEventuallyHasKey
