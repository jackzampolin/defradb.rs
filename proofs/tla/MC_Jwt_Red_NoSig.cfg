\* RED: signature verification disabled (CheckSig = FALSE). Models the Go
\* FromToken path (acp/identity/factory.go:57-90) which jwt.Parse(WithVerify(false))
\* and never re-verifies the signature at construction. t_subswap then accepts:
\* victim kK1's bytes in sub with iss=did(kK1) and a matching header alg, but the
\* token was forged by kAdv. The oracle INV_ReturnedDidIsSignerDid catches it
\* (returned did:k1 != DidOf[kAdv]=did:adv). Proves the signature gate has teeth.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys <- mcKeys
  Algs <- mcAlgs
  KeyCurve <- mcKeyCurve
  DidOf <- mcDidOf
  Tokens <- mcTokens
  HeaderAlg <- mcHeaderAlg
  KtClaim <- mcKtClaim
  SubKey <- mcSubKey
  IssClaim <- mcIssClaim
  SigBy <- mcSigBy
  SigAlg <- mcSigAlg
  CheckAlgBinding = TRUE
  CheckSig = FALSE
  CheckIssBinding = TRUE
  IssAuthoritative = FALSE
  IdentityCurveFromClaim = FALSE
INVARIANT TypeOK
INVARIANT INV_TokenBindsGenuineDid
INVARIANT INV_ResolvedDidIsReal
INVARIANT INV_ReturnedDidIsSignerDid
