\* RED (current main, broadcast.rs): one task is spawned per (write, peer) BEFORE the
\* semaphore, so every arrival becomes resident work retaining its payload buffer -
\* residency grows with total arrivals, not with the worker count.
\* Expect: INV_QueueBounded VIOLATED.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Peers <- mcPeers
  SlowPeers <- mcSlowPeers
  Weight <- mcWeight
  MaxArrivals <- mcMaxArrivals
  QueueCap <- mcQueueCap
  ByteCap <- mcByteCap
  Workers <- mcWorkers
  PerPeerCap <- mcPerPeerCap
  AdmissionMode = "SpawnPerItem"
  ReleaseMode = "Release"
  HandleMode = "FixedWorkers"
  FairnessMode = "PerPeerCap"
INVARIANT INV_TypeOK
INVARIANT INV_QueueBounded
