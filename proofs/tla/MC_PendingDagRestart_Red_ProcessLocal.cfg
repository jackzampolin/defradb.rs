\* RED (current main): pending-DAG registrations are process-local, so a hub crash
\* after the success ack destroys the registration while the pusher has already deleted
\* its retry record - INV_AckBacked is violated at the crash step. Silent, permanent
\* loss: the restart-shaped twin of #1088 M1.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs         <- mcDocs
  Cap          <- mcCap
  RecoveryMode = "ProcessLocal"
INVARIANT INV_TypeOK
INVARIANT INV_AckBacked
