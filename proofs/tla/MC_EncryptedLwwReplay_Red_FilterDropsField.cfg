\* A selected composite omits the encrypted field link that triggers its DEK
\* request after DAG fetch. Expect: INV_NoFilteredLoss VIOLATED.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  LocalVersion <- mcLocalVersion
  RemoteVersion <- mcRemoteVersion
  PendingMode = "Durable"
  FilterMode = "DropEncrypted"
  MergeMode = "Lww"
  KmsFailureMode = "Retry"
INVARIANT INV_TypeOK
INVARIANT INV_NoFilteredLoss
