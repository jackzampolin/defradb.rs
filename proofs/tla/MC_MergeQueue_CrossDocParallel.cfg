\* RED: the pre-stage-3 PerDoc-only policy lets two independent P2P merge writers
\* overlap on different documents even though both mutate shared index keyspaces.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Blocks        <- mcBlocks
  Docs          <- mcDocs
  BlockDoc      <- mcBlockDoc
  Dup           <- mcDup
  MaxRetries    = 5
  MaxUserWrites = 0
  LockMode      = "PerDoc"
  FailMode      = "Closed"
  UserWriteMode = "LockFree"
INVARIANT INV_TypeOK
INVARIANT INV_SingleMergeWriter
