\* ANTI-VACUITY (expected RED): the PerDoc model permits different-document
\* workers to overlap.  The counterexample proves same-doc serialization is
\* not achieved by making every lock global.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Blocks        <- mcBlocks
  Docs          <- mcDocs
  BlockDoc      <- mcBlockDoc
  Dup           <- mcDup
  MaxRetries    = 5
  MaxUserWrites = 0
  LockMode      = "PerDoc"
  FailMode      = "Closed"
  UserWriteMode = "LockFree"
INVARIANT INV_TypeOK
INVARIANT NoCrossDocParallel
