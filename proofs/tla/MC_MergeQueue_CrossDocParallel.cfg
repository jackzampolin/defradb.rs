\* ANTI-VACUITY (expected RED): under the correct PerDoc mutex, NoCrossDocParallel is
\* VIOLATED -> the counterexample exhibits two different-doc merges running concurrently.
\* This proves same-doc serialization is not achieved by a global lock.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Blocks        <- mcBlocks
  Docs          <- mcDocs
  BlockDoc      <- mcBlockDoc
  Dup           <- mcDup
  MaxRetries    = 5
  MaxUserWrites = 0
  LockMode      = "PerDoc"
  FailMode      = "Closed"
INVARIANT INV_TypeOK
INVARIANT NoCrossDocParallel
