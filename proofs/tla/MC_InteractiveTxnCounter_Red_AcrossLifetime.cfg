\* RED (#1041 old path): interactive txn grabs the process-wide gate on the first counter
\* write and HOLDS it across the user-controlled active/idle lifetime
\* (InteractiveGate="AcrossLifetime"). INV_GateBoundedHold is VIOLATED — the gate is held
\* while the interactive actor sits idle, which is exactly the design #1044 removes. This
\* RED-anchors the invariant's non-vacuity. CHECK_DEADLOCK FALSE so TLC reports the
\* invariant violation (not a deadlock) as the verdict.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Docs            <- mcDocs
  ITouched        <- mcITouched
  BTouched        <- mcBTouched
  MergeDoc        <- mcMergeDoc
  GateMode        = "On"
  InteractiveGate = "AcrossLifetime"
INVARIANT INV_TypeOK
INVARIANT INV_GateBoundedHold
