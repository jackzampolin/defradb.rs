\* GREEN: PerTxn isolation + NoHooks rollback + Strict owner check. All invariants hold.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Txns          <- mcTxns
  Docs          <- mcDocs
  Idents        <- mcIdents
  Anon          <- mcAnon
  InitCommitted <- mcInitCommitted
  MaxOps        = 2
  IsolationMode = "PerTxn"
  RollbackMode  = "NoHooks"
  OwnerCheck    = "Strict"
INVARIANT INV_TypeOK
INVARIANT INV_FailClosedActive
INVARIANT INV_NoCrossTxnLeak
INVARIANT INV_RollbackNoOp
