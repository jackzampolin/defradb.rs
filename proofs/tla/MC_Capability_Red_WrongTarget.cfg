\* RED (cross-target / cross-collection replay): the gate omits the collection
\* (and target) binding (NoBind). tGood, issued for (p1->p2, c1), is accepted when
\* presented to a verifier for collection c2 or a different target peer.
\* Expect: INV_TargetBound VIOLATED (and INV_OnlyLegitAccepted with it).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Peers <- mcPeers
  Collections <- mcCollections
  Issuers <- mcIssuers
  Tokens <- mcTokens
  ClaimSrc <- mcClaimSrc
  ClaimTgt <- mcClaimTgt
  ClaimColl <- mcClaimColl
  ClaimIssuer <- mcClaimIssuer
  ClaimExpiry <- mcClaimExpiry
  MaxTtl <- mcMaxTtl
  MaxClock <- mcMaxClock
  HonestIssuers <- mcHonestIssuers
  Attempts <- mcAttempts
  ForgeMode = "Unforgeable"
  TtlMode = "CapAtVerify"
  RevokeMode = "DenyRevoked"
  BindMode = "NoBind"
INVARIANT TypeOK
INVARIANT INV_TargetBound
