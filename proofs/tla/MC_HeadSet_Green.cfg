\* Derived head set: writers only ever write keys derived from their own block
\* id, so nothing conflicts and both concurrent writes land as siblings.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Writers = {w1, w2}
  Seed = seed
  Strategy = "Derived"
  Reclaim = "Together"
INVARIANT TypeOK
INVARIANT INV_NoWriteConflict
INVARIANT INV_DisjointWriteSets
INVARIANT INV_HeadsExact
INVARIANT INV_SiblingsPreserved
PROPERTY EventuallyAllCommit
