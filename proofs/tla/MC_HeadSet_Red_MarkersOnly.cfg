\* Reclamation that removes a head's markers but leaves its head key behind.
\* The head it superseded reads as live again, so the head set no longer matches
\* the DAG's tips and INV_HeadsExact fails. This is what makes "the head key and
\* its markers leave in one transaction" a load-bearing requirement rather than
\* an implementation detail.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Writers = {w1, w2}
  Seed = seed
  Strategy = "Derived"
  Reclaim = "MarkersOnly"
INVARIANT TypeOK
INVARIANT INV_HeadsExact
