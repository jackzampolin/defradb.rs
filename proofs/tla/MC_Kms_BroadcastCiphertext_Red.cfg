\* RED: ciphertext is modeled as decryptable by any topic peer.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- mcNodes
  DIDs <- mcDIDs
  DidOf <- mcDidOf
  Keys <- mcKeys
  InitialAuthorized <- mcInitialAuthorized
  InitiallyHasKey <- mcInitiallyHasKey
  Requesters <- mcRequesters
