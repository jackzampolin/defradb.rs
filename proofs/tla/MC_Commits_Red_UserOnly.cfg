\* RED: only the User path is ACP-gated. The _commits path is open, so an
\* unauthorized caller can read raw CRDT delta blocks and recover the document.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Readers <- mcReaders
  Docs <- mcDocs
  Blocks <- mcBlocks
  DocOfBlock <- mcDocOfBlock
  Grant <- mcGrant
  InitialBlockHolders <- mcInitialBlockHolders
  UserGateMode = "ACP"
  CommitsGateMode = "Open"
  ReplicationGateMode = "ACP"
INVARIANT TypeOK
INVARIANT INV_BothPathsGated
