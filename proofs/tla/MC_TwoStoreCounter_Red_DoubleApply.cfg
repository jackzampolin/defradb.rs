\* RED: unified store (no lost-update), but the merged-set / is_merged dedup guard is
\* OFF. A remote counter delta is re-merged (a field block delivered as its own PushLog
\* head, then also reached via its composite) and re-applied -> blob > doneCount. This is
\* the upstream double-apply bug sourcenetwork/defradb#4935. INV_NoDoubleApply catches it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  LocalOps  = {l1, l2}
  RemoteOps = {r1}
  StoreMode = "Unified"
  Dedup     = "Off"
INVARIANT INV_TypeOK
INVARIANT INV_NoDoubleApply
