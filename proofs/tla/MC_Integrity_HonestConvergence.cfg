\* GREEN: strict integrity does not block honest signed blocks.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- mcNodes
  HonestNodes <- mcHonestNodes
  Identities <- mcIdentities
  HonestIdentities <- mcHonestIdentities
  Adversary <- mcAdversary
  Contents <- mcContents
  Blocks <- mcBlocks
  InitialNetwork <- mcInitialNetwork
  NetworkConnected = TRUE
  MergePolicy = "VerifyThenMerge"
INVARIANT TypeOK
INVARIANT INV_NoForgedMerge
INVARIANT INV_AuthorBinding
INVARIANT INV_NoReplayForge
PROPERTY HonestBlocksEventuallyMerged
