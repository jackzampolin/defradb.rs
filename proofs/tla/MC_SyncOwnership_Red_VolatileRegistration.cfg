\* RED: the register-then-ack handoff is dishonest without durability (#1099
\* inverse). The ack clears the sender's marker; a receiver crash then destroys
\* the only remaining obligation - INV_ObligationConservation is violated in
\* four steps (Update -> hint -> register+ack -> Crash).
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs         = {d1}
  Cols         = {c1}
  MaxV         = 2
  Cap          = 1
  SenderMode   = "MarkerRederive"
  RegisterMode = "Volatile"
  FlightMode   = "SingleFlight"
  AckGuardMode = "HeadCurrent"
INVARIANT INV_TypeOK
INVARIANT INV_ObligationConservation
