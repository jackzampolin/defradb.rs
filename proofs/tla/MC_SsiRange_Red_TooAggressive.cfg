\* RED: too-aggressive carve-out swallows the IndexRange rw-conflict -> write-skew commits
\* -> MVSG cycle on true reads -> INV_Serializable violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Txns       <- mcTxns
  Keys       <- mcKeys
  PointReads <- mcPointReads
  RangeKeys  <- mcRangeKeys
  RangeKind  <- mcRangeKind
  Writes     <- mcWrites
  CarveMode = "TooAggressive"
INVARIANT INV_TypeOK
INVARIANT INV_MonotoneCommit
INVARIANT INV_Serializable
