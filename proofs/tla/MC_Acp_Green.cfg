\* GREEN: revocation propagation clears local tuple state and cached allows.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- mcNodes
  Tuples <- mcTuples
  InitialAuthority <- mcInitialAuthority
  InitiallyKnown <- mcInitiallyKnown
  InitialCache <- mcInitialCache
  Grantable <- mcGrantable
  Revocable <- mcRevocable
  NetworkConnected = TRUE
  EnforcementMode = "CacheInvalidated"
INVARIANT TypeOK
INVARIANT INV_RevokedNotAuthoritative
INVARIANT INV_RevocationConsistent
PROPERTY PROP_RevocationEventuallyEnforced
