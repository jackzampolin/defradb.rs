\* RED (defra-agent#630 same-CID parade): without per-scope single-flight,
\* duplicate hints spawn overlapping fetches for the same head -
\* INV_SingleFlight is violated as soon as a second fetch starts while the
\* first is still active.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs         = {d1}
  Cols         = {c1}
  MaxV         = 2
  Cap          = 1
  SenderMode   = "MarkerRederive"
  RegisterMode = "Durable"
  FlightMode   = "Dup"
  AckGuardMode = "HeadCurrent"
INVARIANT INV_TypeOK
INVARIANT INV_SingleFlight
