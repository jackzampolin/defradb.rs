\* RED: two-store split (reconcile-from-blob, NO cross-store conflict detection).
\* A merge commits its stale reconciled snapshot+delta and clobbers an interleaved
\* local increment -> blob < doneCount. This is the Rust same-doc under-count.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  LocalOps  = {l1, l2}
  RemoteOps = {r1}
  StoreMode = "Split"
  Dedup     = "On"
INVARIANT INV_TypeOK
INVARIANT INV_NoLoss
