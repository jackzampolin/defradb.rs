\* RED: mutable key (x2 rewrites owner X->Y) — INV_NoSplitOwnership expected to FAIL.
\* Twin of MC_S3_Fixed.cfg; differs only in OwnerWrite + KeyMutability.
SPECIFICATION SpecS3
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- mcNodes
  DIDs <- mcDIDs
  DidOf <- mcDidOf
  Blocks <- mcBlocks
  Doc <- mcDoc
  Parents <- mcParents
  Heads <- mcHeads
  OwnerWrite <- mcOwnerWrite
  CreateOwner <- mcCreateOwner
  RelRef <- mcRelRef
  FilteredBlocks <- mcFiltered
  Creator = "src"
  FilterScope = "WholeDoc"
  KeyMutability = "Mutable"
  FetchPolicy = "FullWalkA"
INVARIANT TypeOK
INVARIANT INV_NoSplitOwnership
