\* RED: fail-open exhaustion (Go return-nil bug) -> retry-exhausted block marked done
\* without being applied -> silent drop (INV_NoSilentDrop / INV_NoLoss).
\* MaxUserWrites = MaxRetries + 1 = 6 so the adversary can re-conflict every attempt
\* including the final one, forcing Exhaust.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Blocks        <- mcBlocks
  Docs          <- mcDocs
  BlockDoc      <- mcBlockDoc
  Dup           <- mcDup
  MaxRetries    = 5
  MaxUserWrites = 6
  LockMode      = "PerDoc"
  FailMode      = "Open"
INVARIANT INV_TypeOK
INVARIANT INV_SameDocSerialized
INVARIANT INV_NoDoubleApply
INVARIANT INV_NoSilentDrop
INVARIANT INV_NoLoss
