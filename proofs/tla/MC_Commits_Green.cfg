\* GREEN: User queries, _commits queries, and replication delivery all consult
\* the ACP grant set before returning document content or commit blocks.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Readers <- mcReaders
  Docs <- mcDocs
  Blocks <- mcBlocks
  DocOfBlock <- mcDocOfBlock
  Grant <- mcGrant
  InitialBlockHolders <- mcInitialBlockHolders
  UserGateMode = "ACP"
  CommitsGateMode = "ACP"
  ReplicationGateMode = "ACP"
INVARIANT TypeOK
INVARIANT INV_BothPathsGated
