\* RED (current main, #1113): the document-keyed ledger cannot record
\* collection-commit (doc-less) scopes (push_worker.rs:84-93 warn-and-drop,
\* peerstore.rs:199-203 early return), so the moment a collection hint is
\* dropped or nacked, no state anywhere tracks the obligation -
\* INV_ObligationConservation is violated and the collection never converges.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs         = {d1}
  Cols         = {c1}
  MaxV         = 2
  Cap          = 1
  SenderMode   = "DocKeyedOnly"
  RegisterMode = "Durable"
  FlightMode   = "SingleFlight"
  AckGuardMode = "HeadCurrent"
INVARIANT INV_TypeOK
INVARIANT INV_ObligationConservation
