\* The tree as it stands: each writer deletes every head it observed. Two
\* concurrent writers issue the same delete, regolith rejects the second, and a
\* write that was accepted for processing is lost. INV_NoWriteConflict fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Writers = {w1, w2}
  Seed = seed
  Strategy = "EagerDelete"
  Reclaim = "Together"
INVARIANT TypeOK
INVARIANT INV_NoWriteConflict
