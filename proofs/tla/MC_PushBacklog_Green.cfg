\* GREEN (#1099 fix): bounded item+byte queue admits compact jobs before anything is
\* spawned, a fixed worker pool drains it, completions release their slot, only the
\* pool's handles are retained, and the per-peer active cap (< Workers) isolates the
\* slow peer. All bounds hold and every admitted healthy-peer job is eventually sent.
SPECIFICATION FairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Peers <- mcPeers
  SlowPeers <- mcSlowPeers
  Weight <- mcWeight
  MaxArrivals <- mcMaxArrivals
  QueueCap <- mcQueueCap
  ByteCap <- mcByteCap
  Workers <- mcWorkers
  PerPeerCap <- mcPerPeerCap
  AdmissionMode = "BoundedQueue"
  ReleaseMode = "Release"
  HandleMode = "FixedWorkers"
  FairnessMode = "PerPeerCap"
INVARIANT INV_TypeOK
INVARIANT INV_QueueBounded
INVARIANT INV_PermitConservation
INVARIANT INV_HandlesBounded
INVARIANT INV_NoSilentLoss
PROPERTY LIVE_HealthyProgress
