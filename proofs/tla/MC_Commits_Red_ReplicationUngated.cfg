\* RED: local User and _commits queries are ACP-gated, but replication delivery
\* is open. An unauthorized peer can receive a commit block over P2P.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Readers <- mcReaders
  Docs <- mcDocs
  Blocks <- mcBlocks
  DocOfBlock <- mcDocOfBlock
  Grant <- mcGrant
  InitialBlockHolders <- mcInitialBlockHolders
  UserGateMode = "ACP"
  CommitsGateMode = "ACP"
  ReplicationGateMode = "Open"
INVARIANT TypeOK
INVARIANT INV_BothPathsGated
