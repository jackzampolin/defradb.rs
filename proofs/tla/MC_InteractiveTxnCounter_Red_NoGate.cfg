\* RED (gate is load-bearing): remove the process-wide gate (GateMode="Off"). With no gate
\* serializing the acquisition phase, the irreducibly-incremental, ARBITRARY-order batch
\* acquirer and the interactive commit-time finalize acquire their per-doc guards
\* CONCURRENTLY and in OPPOSITE orders -> a circular-wait DEADLOCK that TLC detects. This
\* proves the BOUNDED GATE — not the (incidental) sorted finalize order — is what prevents
\* deadlock. InteractiveGate="AtCommitOnly" so the only difference from GREEN is the gate.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs            <- mcDocs
  ITouched        <- mcITouched
  BTouched        <- mcBTouched
  MergeDoc        <- mcMergeDoc
  GateMode        = "Off"
  InteractiveGate = "AtCommitOnly"
INVARIANT INV_TypeOK
INVARIANT INV_GateBoundedHold
INVARIANT INV_NoLocalMergeInterleave
INVARIANT INV_SingleGuardOwner
