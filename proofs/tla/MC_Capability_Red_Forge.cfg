\* RED (forgery): the claimed authorizer key issX is compromised. The adversary
\* mints tForgeX/tEternalX claiming issX without honest issuance; the gate's
\* signature check passes, so a forged capability is accepted.
\* Expect: INV_OnlyLegitAccepted VIOLATED (accepted attempt has no honest issue).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Peers <- mcPeers
  Collections <- mcCollections
  Issuers <- mcIssuers
  Tokens <- mcTokens
  ClaimSrc <- mcClaimSrc
  ClaimTgt <- mcClaimTgt
  ClaimColl <- mcClaimColl
  ClaimIssuer <- mcClaimIssuer
  ClaimExpiry <- mcClaimExpiry
  MaxTtl <- mcMaxTtl
  MaxClock <- mcMaxClock
  HonestIssuers <- mcHonestIssuers
  Attempts <- mcAttempts
  ForgeMode = "IssuerKeyCompromised"
  TtlMode = "CapAtVerify"
  RevokeMode = "DenyRevoked"
  BindMode = "BindTargetCollection"
INVARIANT TypeOK
INVARIANT INV_OnlyLegitAccepted
