\* GREEN: DID filtering is claim-neutral when all same-DID contenders remain in a
\* common mutual replication set.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Instances <- mcInstances
  DIDs <- mcDIDs
  DidOf <- mcDidOf
  RequestDID <- mcRequestDID
  ClaimRank <- mcClaimRank
  ReplicationPeers <- mcPeersFiltered
INVARIANT TypeOK
PROPERTY INV_EventualClaimUnique
PROPERTY INV_FilterNeutral
