\* GREEN: hardened Rust from_token -- alg<->key binding + signature verify +
\* iss<->did binding all enforced. Every attack token is rejected; the only
\* DID minted is the victim's own for the honest token. All three oracle
\* invariants (independent of the mechanism's decision) hold.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys <- mcKeys
  Algs <- mcAlgs
  KeyCurve <- mcKeyCurve
  DidOf <- mcDidOf
  Tokens <- mcTokens
  HeaderAlg <- mcHeaderAlg
  KtClaim <- mcKtClaim
  SubKey <- mcSubKey
  IssClaim <- mcIssClaim
  SigBy <- mcSigBy
  SigAlg <- mcSigAlg
  CheckAlgBinding = TRUE
  CheckSig = TRUE
  CheckIssBinding = TRUE
  IssAuthoritative = FALSE
  IdentityCurveFromClaim = FALSE
INVARIANT TypeOK
INVARIANT INV_TokenBindsGenuineDid
INVARIANT INV_ResolvedDidIsReal
INVARIANT INV_ReturnedDidIsSignerDid
