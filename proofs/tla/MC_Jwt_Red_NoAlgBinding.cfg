\* RED: algorithm-confusion. The alg<->key binding check is disabled
\* (CheckAlgBinding = FALSE) and the build derives the actor identity from the
\* kt_claim curve while verifying the signature under the header alg
\* (IdentityCurveFromClaim = TRUE) -- the precise bug that mod.rs:284-294 prevents.
\* t_algconf is accepted: signature genuinely verifies under EdDSA against the
\* adversary's own key, but the identity is reconstructed on the disagreeing
\* ES256K curve, minting a cross-curve DID that owns to no real key. iss is set
\* to that sentinel so iss-binding also passes -- only alg-binding stops it. The
\* independent oracle INV_ResolvedDidIsReal fires (returned "did:crosscurve" is
\* not the did of any key) and INV_TokenBindsGenuineDid fires (no genuine signer
\* for that did). Proves the alg<->key binding check has teeth.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys <- mcKeys
  Algs <- mcAlgs
  KeyCurve <- mcKeyCurve
  DidOf <- mcDidOf
  Tokens <- mcTokens
  HeaderAlg <- mcHeaderAlg
  KtClaim <- mcKtClaim
  SubKey <- mcSubKey
  IssClaim <- mcIssClaim
  SigBy <- mcSigBy
  SigAlg <- mcSigAlg
  CheckAlgBinding = FALSE
  CheckSig = TRUE
  CheckIssBinding = TRUE
  IssAuthoritative = FALSE
  IdentityCurveFromClaim = TRUE
INVARIANT TypeOK
INVARIANT INV_TokenBindsGenuineDid
INVARIANT INV_ResolvedDidIsReal
INVARIANT INV_ReturnedDidIsSignerDid
