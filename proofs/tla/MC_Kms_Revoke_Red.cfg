\* RED: responder trusts request-time authorization after revocation.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- mcNodes
  DIDs <- mcDIDs
  DidOf <- mcDidOf
  Keys <- mcKeys
  InitialAuthorized <- mcInitialAuthorized
  InitiallyHasKey <- mcInitiallyHasKey
  Requesters <- mcRequesters
  Grantable <- mcGrantable
  Revocable <- mcRevocable
  NetworkConnected = TRUE
  PolicyMode = "StaleRequestAuth"
  CryptoMode = "RecipientOnly"
INVARIANT TypeOK
INVARIANT INV_RevokedCannotObtain
