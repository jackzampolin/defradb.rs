\* GREEN: PerDoc mutex + fail-closed exhaustion. All safety invariants hold.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Blocks        <- mcBlocks
  Docs          <- mcDocs
  BlockDoc      <- mcBlockDoc
  Dup           <- mcDup
  MaxRetries    = 5
  MaxUserWrites = 2
  LockMode      = "PerDoc"
  FailMode      = "Closed"
INVARIANT INV_TypeOK
INVARIANT INV_SameDocSerialized
INVARIANT INV_NoDoubleApply
INVARIANT INV_NoSilentDrop
INVARIANT INV_NoLoss
