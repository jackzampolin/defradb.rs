\* GREEN (#1044 fix): interactive txn holds NO gate while active/idle; it takes the gate
\* only inside the atomic commit-time finalize (InteractiveGate="AtCommitOnly"). Deadlock-
\* free (sorted acquire shared with the batch acquirer) and INV_GateBoundedHold holds.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs            <- mcDocs
  ITouched        <- mcITouched
  BTouched        <- mcBTouched
  MergeDoc        <- mcMergeDoc
  InteractiveGate = "AtCommitOnly"
INVARIANT INV_TypeOK
INVARIANT INV_GateBoundedHold
INVARIANT INV_NoLocalMergeInterleave
INVARIANT INV_SingleGuardOwner
