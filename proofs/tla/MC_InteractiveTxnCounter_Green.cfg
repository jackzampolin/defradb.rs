\* GREEN (#1044 fix): the process-wide gate is On, so the multi-doc acquirers (interactive
\* finalize, arbitrary-order batch) never acquire concurrently -> deadlock-free. The
\* interactive txn holds NO gate while active/idle; it takes the gate only inside the atomic
\* commit-time finalize (InteractiveGate="AtCommitOnly"), so INV_GateBoundedHold holds.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs            <- mcDocs
  ITouched        <- mcITouched
  BTouched        <- mcBTouched
  MergeDoc        <- mcMergeDoc
  GateMode        = "On"
  InteractiveGate = "AtCommitOnly"
INVARIANT INV_TypeOK
INVARIANT INV_GateBoundedHold
INVARIANT INV_NoLocalMergeInterleave
INVARIANT INV_SingleGuardOwner
