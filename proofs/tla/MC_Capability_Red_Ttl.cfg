\* RED (TTL escalation under key compromise): issX is compromised AND the verify
\* path trusts the signed expiry without re-bounding it (CapAtIssueOnly -- the bug
\* where only generate_capability caps TTL, not validate_claims). The adversary
\* signs tEternalX (expiry 100, far over the cap-5) and it is accepted.
\* Expect: INV_TtlCapped VIOLATED.
\* Contrast with MC_Capability_Red_Forge, which keeps CapAtVerify and so still
\* rejects tEternalX on the TTL cap even under the same key compromise.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Peers <- mcPeers
  Collections <- mcCollections
  Issuers <- mcIssuers
  Tokens <- mcTokens
  ClaimSrc <- mcClaimSrc
  ClaimTgt <- mcClaimTgt
  ClaimColl <- mcClaimColl
  ClaimIssuer <- mcClaimIssuer
  ClaimExpiry <- mcClaimExpiry
  MaxTtl <- mcMaxTtl
  MaxClock <- mcMaxClock
  HonestIssuers <- mcHonestIssuers
  Attempts <- mcAttempts
  ForgeMode = "IssuerKeyCompromised"
  TtlMode = "CapAtIssueOnly"
  RevokeMode = "DenyRevoked"
  BindMode = "BindTargetCollection"
INVARIANT TypeOK
INVARIANT INV_TtlCapped
