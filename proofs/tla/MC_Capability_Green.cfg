\* GREEN: production gate -- unforgeable crypto boundary, TTL re-checked at
\* verify, deny-list honored, full (target+collection) binding. All four safety
\* invariants hold over every interleaving (forged/cross-target/over-cap/revoked
\* attempts are all rejected by the gate).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Peers <- mcPeers
  Collections <- mcCollections
  Issuers <- mcIssuers
  Tokens <- mcTokens
  ClaimSrc <- mcClaimSrc
  ClaimTgt <- mcClaimTgt
  ClaimColl <- mcClaimColl
  ClaimIssuer <- mcClaimIssuer
  ClaimExpiry <- mcClaimExpiry
  MaxTtl <- mcMaxTtl
  MaxClock <- mcMaxClock
  HonestIssuers <- mcHonestIssuers
  Attempts <- mcAttempts
  ForgeMode = "Unforgeable"
  TtlMode = "CapAtVerify"
  RevokeMode = "DenyRevoked"
  BindMode = "BindTargetCollection"
INVARIANT TypeOK
INVARIANT INV_OnlyLegitAccepted
INVARIANT INV_TargetBound
INVARIANT INV_TtlCapped
INVARIANT INV_RevokedNeverAccepted
