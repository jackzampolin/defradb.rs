\* GREEN (#1116 target): marker-plus-rederive sender (docs AND collection
\* commits), durable receiver registration, per-scope single-flight, and
\* head-currency-guarded ack clearing. Every behind scope is always tracked
\* (marker / hint / registration), fetches never overlap, the want-queue stays
\* bounded, and - with re-hints and fetches fair - every scope converges to
\* its newest head and stays there, one receiver crash included.
SPECIFICATION FairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs         = {d1}
  Cols         = {c1}
  MaxV         = 2
  Cap          = 1
  SenderMode   = "MarkerRederive"
  RegisterMode = "Durable"
  FlightMode   = "SingleFlight"
  AckGuardMode = "HeadCurrent"
INVARIANT INV_TypeOK
INVARIANT INV_ObligationConservation
INVARIANT INV_SingleFlight
INVARIANT INV_ReceiverQueueBounded
INVARIANT INV_SenderMarkersOnly
PROPERTY LIVE_EventualCurrency
