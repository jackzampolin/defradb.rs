\* RED: remove the shared per-doc guard (LockMode="None") while local writes still take
\* the #1021 shared-guard path (UserWriteMode="PerDoc"). A local user-write and a same-doc
\* merge then both occupy the critical section -> INV_NoLocalMergeInterleave violated.
\* This RED-anchors the invariant's non-vacuity: it is falsified by removing the shared
\* guard, NOT by lock-free user-writes.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Blocks        <- mcBlocks
  Docs          <- mcDocs
  BlockDoc      <- mcBlockDoc
  Dup           <- mcDup
  MaxRetries    = 5
  MaxUserWrites = 2
  LockMode      = "None"
  FailMode      = "Closed"
  UserWriteMode = "PerDoc"
INVARIANT INV_TypeOK
INVARIANT INV_NoLocalMergeInterleave
