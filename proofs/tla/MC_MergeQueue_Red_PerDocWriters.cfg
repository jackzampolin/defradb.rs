\* RED: the pre-stage-3 PerDoc-only receiver policy allows two independent P2P
\* merge writers to overlap on shared index/ownership keyspaces.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Blocks        <- mcBlocks
  Docs          <- mcDocs
  BlockDoc      <- mcBlockDoc
  Dup           <- mcDup
  MaxRetries    = 5
  MaxUserWrites = 0
  LockMode      = "PerDoc"
  FailMode      = "Closed"
  UserWriteMode = "LockFree"
INVARIANT INV_TypeOK
INVARIANT INV_SingleMergeWriter
