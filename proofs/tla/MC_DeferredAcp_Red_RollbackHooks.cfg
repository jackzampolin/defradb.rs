\* RED: rollback runs hooks (atomicity bug). INV_RollbackNoOp / INV_FailClosedAfterCommit violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Txns          <- mcTxns
  Docs          <- mcDocs
  Idents        <- mcIdents
