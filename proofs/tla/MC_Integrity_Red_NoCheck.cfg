\* RED: missing signature gate allows unsigned/invalid/forged blocks to merge.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- mcNodes
  HonestNodes <- mcHonestNodes
  Identities <- mcIdentities
  HonestIdentities <- mcHonestIdentities
  Adversary <- mcAdversary
  Contents <- mcContents
  Blocks <- mcBlocks
  InitialNetwork <- mcInitialNetwork
  NetworkConnected = TRUE
  MergePolicy = "NoCheck"
INVARIANT TypeOK
INVARIANT INV_NoForgedMerge
