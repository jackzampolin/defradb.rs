\* RED (current main, no per-peer fairness): nothing caps a single peer's active sends,
\* so the slow peer's stuck jobs (30s timeout each in the real code) take every worker
\* and an admitted healthy-peer job waits forever.
\* Expect: LIVE_HealthyProgress (temporal property) VIOLATED.
\* CHECK_DEADLOCK FALSE: the starved end state has no successors by construction (slow
\* sends never complete); deadlock reporting would preempt the liveness attribution.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  Peers <- mcPeers
  SlowPeers <- mcSlowPeers
  Weight <- mcWeight
  MaxArrivals <- mcMaxArrivals
  QueueCap <- mcQueueCap
  ByteCap <- mcByteCap
  Workers <- mcWorkers
  PerPeerCap <- mcPerPeerCap
  AdmissionMode = "BoundedQueue"
  ReleaseMode = "Release"
  HandleMode = "FixedWorkers"
  FairnessMode = "Unfair"
INVARIANT INV_TypeOK
PROPERTY LIVE_HealthyProgress
