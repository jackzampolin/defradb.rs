\* GREEN (#1099 fix): pending-DAG registrations are persisted at admission and restored
\* after the crash, so every success ack stays backed by completable hub state and -
\* with restore and per-doc retries fair - every pushed doc still merges.
SPECIFICATION FairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs         <- mcDocs
  Cap          <- mcCap
  RecoveryMode = "Persist"
INVARIANT INV_TypeOK
INVARIANT INV_AckBacked
PROPERTY EventuallyAllMerged
