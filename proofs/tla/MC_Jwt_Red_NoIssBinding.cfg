\* RED: issuer-trusting build. IssAuthoritative = TRUE means the actor DID is
\* taken from the iss CLAIM (not re-derived from the verified pubkey), and the
\* iss<->did binding check is disabled (CheckIssBinding = FALSE). t_issforge then
\* impersonates the victim: adversary genuinely signs with own kAdv (EdDSA), so
\* alg-binding and signature both pass, but iss lies "did:k1" and that lie becomes
\* the returned actor DID. The independent oracle INV_ReturnedDidIsSignerDid
\* fires (returned did:k1 != DidOf[kAdv]=did:adv). This is the precise assumption
\* the Auth slice relies on: a verified token binds the actor DID. The hardened
\* Rust build derives the DID from the verified pubkey (mod.rs:308-312) and also
\* enforces iss==did (mod.rs:315-323), defeating this attack.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Keys <- mcKeys
  Algs <- mcAlgs
  KeyCurve <- mcKeyCurve
  DidOf <- mcDidOf
  Tokens <- mcTokens
  HeaderAlg <- mcHeaderAlg
  KtClaim <- mcKtClaim
  SubKey <- mcSubKey
  IssClaim <- mcIssClaim
  SigBy <- mcSigBy
  SigAlg <- mcSigAlg
  CheckAlgBinding = TRUE
  CheckSig = TRUE
  CheckIssBinding = FALSE
  IssAuthoritative = TRUE
  IdentityCurveFromClaim = FALSE
INVARIANT TypeOK
INVARIANT INV_TokenBindsGenuineDid
INVARIANT INV_ResolvedDidIsReal
INVARIANT INV_ReturnedDidIsSignerDid
