\* RED (current main, SyncShutdownHandle): every completed job's JoinHandle is retained
\* until shutdown and never pruned, so retained handles grow with completions - the
\* resident-memory twin of the spawn flood.
\* Expect: INV_HandlesBounded VIOLATED.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Peers <- mcPeers
  SlowPeers <- mcSlowPeers
  Weight <- mcWeight
  MaxArrivals <- mcMaxArrivals
  QueueCap <- mcQueueCap
  ByteCap <- mcByteCap
  Workers <- mcWorkers
  PerPeerCap <- mcPerPeerCap
  AdmissionMode = "BoundedQueue"
  ReleaseMode = "Release"
  HandleMode = "RetainAll"
  FairnessMode = "PerPeerCap"
INVARIANT INV_TypeOK
INVARIANT INV_HandlesBounded
