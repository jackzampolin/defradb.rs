\* RED: no per-doc mutex -> concurrent same-doc merges double-apply a duplicate block.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Blocks        <- mcBlocks
  Docs          <- mcDocs
  BlockDoc      <- mcBlockDoc
  Dup           <- mcDup
  MaxRetries    = 5
  MaxUserWrites = 2
  LockMode      = "None"
  FailMode      = "Closed"
INVARIANT INV_TypeOK
INVARIANT INV_SameDocSerialized
INVARIANT INV_NoDoubleApply
INVARIANT INV_NoSilentDrop
INVARIANT INV_NoLoss
