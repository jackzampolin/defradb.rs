\* RED (stage-3 implementation hazard): if an ack may clear the marker without
\* checking that the acked version is still the scope's newest head, an ack for
\* a superseded head erases the obligation for the newer one (the
\* PushCoalescing stale-retry race, ownership-model edition) -
\* INV_ObligationConservation is violated once the newer hint is lost.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs         = {d1}
  Cols         = {c1}
  MaxV         = 2
  Cap          = 1
  SenderMode   = "MarkerRederive"
  RegisterMode = "Durable"
  FlightMode   = "SingleFlight"
  AckGuardMode = "Unguarded"
INVARIANT INV_TypeOK
INVARIANT INV_ObligationConservation
