\* RED (worker-slot leak): a completing job does not return its worker slot, so the
\* accounting identity free + held = pool size decays with every completion until no
\* worker can ever start again.
\* Expect: INV_PermitConservation VIOLATED.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Peers <- mcPeers
  SlowPeers <- mcSlowPeers
  Weight <- mcWeight
  MaxArrivals <- mcMaxArrivals
  QueueCap <- mcQueueCap
  ByteCap <- mcByteCap
  Workers <- mcWorkers
  PerPeerCap <- mcPerPeerCap
  AdmissionMode = "BoundedQueue"
  ReleaseMode = "Leak"
  HandleMode = "FixedWorkers"
  FairnessMode = "PerPeerCap"
INVARIANT INV_TypeOK
INVARIANT INV_PermitConservation
