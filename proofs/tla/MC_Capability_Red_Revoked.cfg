\* RED (revocation ignored): the verify path skips the deny-list check
\* (IgnoreRevoked). After revoke_capability puts tGood on the deny-list, a fresh
\* presentation of tGood is still accepted.
\* Expect: INV_RevokedNeverAccepted VIOLATED (acceptedWhileRevoked non-empty).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Peers <- mcPeers
  Collections <- mcCollections
  Issuers <- mcIssuers
  Tokens <- mcTokens
  ClaimSrc <- mcClaimSrc
  ClaimTgt <- mcClaimTgt
  ClaimColl <- mcClaimColl
  ClaimIssuer <- mcClaimIssuer
  ClaimExpiry <- mcClaimExpiry
  MaxTtl <- mcMaxTtl
  MaxClock <- mcMaxClock
  HonestIssuers <- mcHonestIssuers
  Attempts <- mcAttempts
  ForgeMode = "Unforgeable"
  TtlMode = "CapAtVerify"
  RevokeMode = "IgnoreRevoked"
  BindMode = "BindTargetCollection"
INVARIANT TypeOK
INVARIANT INV_RevokedNeverAccepted
