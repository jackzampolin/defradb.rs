\* RED: checking signature/content without binding signer to claimed author
\* admits spoofed authorship.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- mcNodes
  HonestNodes <- mcHonestNodes
  Identities <- mcIdentities
  HonestIdentities <- mcHonestIdentities
  Adversary <- mcAdversary
  Contents <- mcContents
  Blocks <- mcBlocks
  InitialNetwork <- mcInitialNetwork
  NetworkConnected = TRUE
  MergePolicy = "SigOnly"
INVARIANT TypeOK
INVARIANT INV_AuthorBinding
