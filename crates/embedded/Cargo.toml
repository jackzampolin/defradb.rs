[package]
name = "embedded"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable embedded/mobile DefraDB node assembly"

[dependencies]
acp = { path = "../acp" }
blockstore = { path = "../blockstore" }
crypto = { path = "../crypto" }
db = { path = "../db" }
db-merge = { path = "../db-merge" }
defra-core = { path = "../defra-core" }
defra-http = { path = "../http" }
defra-p2p-adapter = { workspace = true, default-features = false, features = ["libp2p"] }
document = { path = "../document" }
events = { path = "../events" }
identity = { path = "../identity" }
kms = { path = "../kms" }
lens = { path = "../lens" }
p2p = { path = "../p2p", features = ["libp2p-transport"] }
query = { path = "../query" }
schema = { path = "../schema" }
sourcehub = { path = "../sourcehub" }
storage = { path = "../storage" }

anyhow.workspace = true
bytes.workspace = true
async-trait.workspace = true
cid.workspace = true
hex.workspace = true
libp2p.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_ipld_dagcbor.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tracing.workspace = true

[features]
default = ["lark", "redb"]
lark = ["storage/lark"]
redb = ["storage/redb"]
iroh = ["p2p/iroh-transport", "defra-p2p-adapter/iroh"]

[dev-dependencies]
tempfile = "3.17"
tokio = { workspace = true, features = ["full"] }
zeroize = "1"

[lints]
workspace = true
