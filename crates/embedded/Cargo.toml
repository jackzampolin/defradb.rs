[package]
name = "embedded"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable embedded/mobile DefraDB node assembly"

[package.metadata.cargo-machete]
ignored = ["bytes", "document", "lens", "serde", "serde_bytes", "serde_ipld_dagcbor", "thiserror"]

[lib]
bench = false

[dependencies]
acp = { path = "../acp" }
blockstore = { path = "../blockstore" }
crypto = { path = "../crypto" }
db = { path = "../db", default-features = false }
defra-core = { path = "../defra-core" }
defra-http = { path = "../http" }
defra-p2p-adapter = { workspace = true, default-features = false, features = ["libp2p"] }
document = { path = "../document" }
events = { path = "../events" }
identity = { path = "../identity" }
kms = { path = "../kms" }
lens = { path = "../lens", default-features = false }
p2p = { path = "../p2p", features = ["libp2p-transport"] }
query = { path = "../query" }
replication-filter = { path = "../replication-filter" }
schema = { path = "../schema" }
sourcehub = { path = "../sourcehub", optional = true }
storage = { path = "../storage" }

anyhow.workspace = true
bytes.workspace = true
async-trait.workspace = true
cid.workspace = true
hex.workspace = true
libp2p.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_ipld_dagcbor.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "fs", "sync", "time"] }
tracing.workspace = true

[features]
default = ["native", "wasmtime-runtime", "lark", "redb"]
native = ["db/native", "db/p2p", "defra-p2p-adapter/native"]
wasmtime-runtime = [
    "db/wasmtime-runtime",
    
    "defra-p2p-adapter/wasmtime-runtime",
    "lens/wasmtime-runtime",
]
lark = ["storage/lark"]
redb = ["db/redb", "storage/redb"]
# SourceHub on-chain document ACP.
sourcehub = ["dep:sourcehub"]
iroh = ["p2p/iroh-transport", "defra-p2p-adapter/iroh"]

[dev-dependencies]
base64 = { workspace = true }
tempfile = "3.17"
tokio = { workspace = true, features = ["rt-multi-thread"] }
zeroize = "1"
zstd = "0.13"

[lints]
workspace = true
