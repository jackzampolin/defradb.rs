[package]
name = "embedded"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable embedded/mobile DefraDB node assembly"

[dependencies]
acp = { path = "../acp" }
blockstore = { path = "../blockstore" }
crypto = { path = "../crypto" }
db = { path = "../db" }
defra-core = { path = "../defra-core" }
document = { path = "../document" }
events = { path = "../events" }
identity = { path = "../identity" }
lens = { path = "../lens" }
p2p = { path = "../p2p" }
query = { path = "../query" }
sourcehub = { path = "../sourcehub" }
storage = { path = "../storage" }

anyhow.workspace = true
async-trait.workspace = true
cid.workspace = true
hex.workspace = true
libp2p.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_ipld_dagcbor.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tracing.workspace = true

[dependencies.rand]
version = "0.9"
optional = true

[dependencies.iroh-net]
package = "iroh"
version = "0.96"
optional = true

[features]
default = []
iroh = ["p2p/iroh-transport", "dep:iroh-net", "dep:rand"]

[dev-dependencies]
tempfile = "3.17"
tokio = { workspace = true, features = ["full"] }
