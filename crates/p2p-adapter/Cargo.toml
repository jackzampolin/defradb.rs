[package]
name = "defra-p2p-adapter"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DefraDB P2P adapters for HTTP-facing operations"

[dependencies]
acp = { path = "../acp" }
blockstore = { path = "../blockstore" }
db = { path = "../db", default-features = false }
db-merge = { path = "../db-merge", default-features = false }
defra-core = { path = "../defra-core" }
defra-http = { path = "../http" }
document = { path = "../document" }
events = { path = "../events" }
identity = { path = "../identity" }
lens = { path = "../lens", default-features = false }
p2p = { path = "../p2p", default-features = false }
replication-filter = { path = "../replication-filter" }
schema = { path = "../schema" }
storage = { path = "../storage" }

async-trait.workspace = true
bytes.workspace = true
chrono = { version = "0.4", features = ["serde"] }
cid.workspace = true
hex.workspace = true
libp2p = { workspace = true, optional = true }
serde.workspace = true
serde_bytes.workspace = true
serde_ipld_dagcbor.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tracing.workspace = true
zeroize = "1"

[dev-dependencies]
crypto = { path = "../crypto" }
data-encoding = "2"
db-nac = { path = "../db-nac" }
iroh.workspace = true

[features]
default = ["native", "wasmtime-runtime", "iroh", "libp2p"]
native = ["db/native", "db-merge/native"]
wasmtime-runtime = ["db/wasmtime-runtime", "db-merge/wasmtime-runtime", "lens/wasmtime-runtime"]
iroh = ["p2p/iroh-transport"]
libp2p = ["dep:libp2p", "p2p/libp2p-transport"]

[lints]
workspace = true
