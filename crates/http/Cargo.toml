[package]
name = "defra-http"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
ignored = ["futures", "hyper"]

[features]
default = []
test-utils = []

[dependencies]
# Internal crates
query = { path = "../query" }
identity = { path = "../identity" }
schema = { path = "../schema" }
acp = { path = "../acp" }
events = { path = "../events" }
defra-core = { path = "../defra-core" }
defra-version = { path = "../defra-version" }
crypto = { path = "../crypto" }
lens = { path = "../lens", default-features = false }
db = { path = "../db", default-features = false, features = ["native"] }

# Encoding
hex = "0.4"
base64.workspace = true
cid.workspace = true

# Async runtime
tokio.workspace = true
tokio-stream.workspace = true
async-trait.workspace = true
futures.workspace = true
async-stream = "0.3"

# Serialization
serde.workspace = true
serde_json.workspace = true

# HTTP server
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true
telemetry = { path = "../telemetry" }

# Retry jitter
rand.workspace = true

[dev-dependencies]
criterion.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
urlencoding = "2.1"
crypto = { path = "../crypto" }

# Enable test-utils feature for integration tests
defra-http = { path = ".", features = ["test-utils"] }
storage = { path = "../storage" }

[[bench]]
name = "transport"
harness = false

[lints]
workspace = true
