[package]
name = "kms"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Key Management Service for DefraDB — DEK generation, wrapping, distribution under NAC/DAC"

# Tracks Go DefraDB's `internal/kms/` package and the NAC-aware fix from
# Go PR #4778 (commit 1fab9fb3). Design doc: defradb.rs issue #976.
#
# Implementation lands across milestones M1–M7 on separate branches.
# This crate is a stub at design time.

[package.metadata.cargo-machete]
ignored = ["orbis", "sourcehub"]

[features]
default = []
# Threshold (Orbis) backend. M6.
threshold = ["dep:orbis"]
# SourceHub-attested release policy. M4.
sourcehub = ["dep:sourcehub"]

[lib]
bench = false

[dependencies]
ciborium.workspace = true
defra-core = { path = "../defra-core" }
crypto = { path = "../crypto" }
acp = { path = "../acp" }
identity = { path = "../identity" }

# Optional backends — feature-gated until the corresponding milestone lands.
orbis = { path = "../orbis", optional = true }
sourcehub = { path = "../sourcehub", optional = true }

async-trait.workspace = true
async-lock.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_bytes = "0.11"
base64 = "0.22"
zeroize = "1.8"
rand = { workspace = true }
uuid = { workspace = true }
cid = { workspace = true }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-channel = "2"
futures.workspace = true
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.35", default-features = false, features = ["rt", "sync", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "test-util"] }

[lints]
workspace = true
