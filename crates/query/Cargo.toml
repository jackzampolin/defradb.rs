[package]
name = "query"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
bench = false

[dependencies]
web-time.workspace = true
# Internal crates
cursor = { path = "../cursor" }
defra-core = { path = "../defra-core" }
document = { path = "../document" }
storage = { path = "../storage" }
schema = { path = "../schema" }
identity = { path = "../identity" }
acp = { path = "../acp" }
lens = { path = "../lens", default-features = false }

# Async runtime
async-trait.workspace = true
async-lock.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
ciborium.workspace = true

# Error handling
thiserror.workspace = true

base64.workspace = true

# Content addressing
cid.workspace = true
sha2.workspace = true

# Logging
tracing.workspace = true

# Full-text search
bm25.workspace = true

# GraphQL parsing
graphql-parser.workspace = true

# Regex (SDL preprocessing)
regex = "1"

# GraphQL introspection execution
async-graphql = "7"

# Time handling (for DateTime parsing in mutations)
chrono = { version = "0.4", features = ["serde"] }

# Query timeouts are native-only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.35", default-features = false, features = ["rt", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
