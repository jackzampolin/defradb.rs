[package]
name = "query"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Internal crates
defra-core = { path = "../defra-core" }
document = { path = "../document" }
storage = { path = "../storage" }
schema = { path = "../schema" }
crdt = { path = "../crdt" }
blockstore = { path = "../blockstore" }
identity = { path = "../identity" }
acp = { path = "../acp" }
lens = { path = "../lens", default-features = false }

# Async runtime
async-trait.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
ciborium.workspace = true

# Cryptography (for stable ID generation)
sha2.workspace = true
base64.workspace = true

# Content addressing
cid.workspace = true

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true
parking_lot.workspace = true
lru.workspace = true

# Full-text search
bm25.workspace = true
bm25_turbo = { git = "https://github.com/TheSauceSuite/BM25-Turbo-Rust-Python-WASM-CLI", rev = "01ef1864c6ea5224c7c4711f8973c3c4f8f68b00", package = "bm25_turbo", default-features = false }

# GraphQL parsing
graphql-parser.workspace = true

# GraphQL introspection execution
async-graphql = "7"

# Regex for SDL preprocessing
regex = "1"

# Time handling (for DateTime parsing in mutations)
chrono = { version = "0.4", features = ["serde"] }

# Tokio is only needed on non-WASM targets (for query timeouts)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
db = { path = "../db" }
datastore = { path = "../datastore" }

[[bench]]
name = "parsing"
harness = false

[[bench]]
name = "filter"
harness = false

[[bench]]
name = "groupby"
harness = false

[[bench]]
name = "planner"
harness = false
