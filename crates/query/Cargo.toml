[package]
name = "query"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Internal crates
query-types = { path = "../query-types" }
query-parse = { path = "../query-parse" }
query-plan = { path = "../query-plan" }
defra-core = { path = "../defra-core" }
document = { path = "../document" }
storage = { path = "../storage" }
schema = { path = "../schema" }
crdt = { path = "../crdt" }
blockstore = { path = "../blockstore" }
identity = { path = "../identity" }
acp = { path = "../acp" }
lens = { path = "../lens", default-features = false }

# Async runtime
async-trait.workspace = true
async-lock.workspace = true
futures.workspace = true
tokio = { version = "1.35", default-features = false, features = ["rt"] }

# Serialization
serde.workspace = true
serde_json.workspace = true
ciborium.workspace = true

# Cryptography (for stable ID generation)
sha2.workspace = true
base64.workspace = true

# Content addressing
cid.workspace = true

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true

# Full-text search
bm25.workspace = true

# GraphQL parsing
graphql-parser.workspace = true

# GraphQL introspection execution
async-graphql = "7"

# Regex for SDL preprocessing
regex = "1"

# Time handling (for DateTime parsing in mutations)
chrono = { version = "0.4", features = ["serde"] }

# Query timeouts are native-only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.35", default-features = false, features = ["time"] }

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
db = { path = "../db" }
datastore = { path = "../datastore" }

[[bench]]
name = "parsing"
harness = false

[[bench]]
name = "filter"
harness = false

[[bench]]
name = "groupby"
harness = false

[[bench]]
name = "planner"
harness = false

[lints]
workspace = true
