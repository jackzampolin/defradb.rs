[package]
name = "db"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DefraDB database and collection management"

[features]
default = ["p2p", "native"]
p2p = ["dep:p2p", "dep:libp2p"]
native = ["dep:tokio", "lens/wasmtime-runtime", "events/channel", "acp/native"]

[dependencies]
# Async runtime
async-trait.workspace = true
async-lock.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_cbor.workspace = true
ciborium.workspace = true

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true

# IPLD
cid.workspace = true
multihash.workspace = true

# Hashing
sha2.workspace = true

# Random number generation (for Counter CRDT nonces)
rand = "0.8"

# Encoding
base64.workspace = true
hex.workspace = true

# P2P (optional)
libp2p = { workspace = true, optional = true }

# Native-only (optional)
tokio = { workspace = true, features = ["sync"], optional = true }

# Internal crates
storage = { path = "../storage" }
datastore = { path = "../datastore" }
schema = { path = "../schema" }
document = { path = "../document" }
query = { path = "../query" }
blockstore = { path = "../blockstore" }
crypto = { path = "../crypto" }
defra-core = { path = "../defra-core" }
identity = { path = "../identity" }
acp = { path = "../acp", default-features = false }
crdt = { path = "../crdt" }
events = { path = "../events", default-features = false }
lens = { path = "../lens", default-features = false }

# P2P (optional)
p2p = { path = "../p2p", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
proptest.workspace = true
