[package]
name = "db"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DefraDB database and collection management"

[package.metadata.cargo-machete]
ignored = ["anyhow", "bytes", "libp2p", "multihash", "p2p", "rand", "serde", "serde_bytes", "serde_cbor", "zeroize"]

[features]
default = ["p2p", "native", "wasmtime-runtime"]
p2p = ["dep:p2p", "dep:libp2p", "p2p/libp2p-transport"]
native = ["dep:tokio", "events/channel", "acp/native"]
redb = ["storage/redb", "acp/redb"]
rocksdb = ["storage/rocksdb"]
fjall = ["storage/fjall"]
wasmtime-runtime = ["lens/wasmtime-runtime"]

[dependencies]
web-time.workspace = true
# Async runtime
async-trait.workspace = true
async-lock.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_bytes.workspace = true
ciborium.workspace = true
chrono = { version = "0.4", features = ["serde"] }

# Bytes (zero-copy block data on hot path)
bytes.workspace = true

# Memory zeroization for sensitive key material
zeroize = "1"

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true

# IPLD
cid.workspace = true
multihash.workspace = true

# Hashing
sha2.workspace = true

# Random number generation (for Counter CRDT nonces)
rand.workspace = true

# Encoding
base64.workspace = true
hex.workspace = true

# P2P (optional)
libp2p = { workspace = true, optional = true }

# Native-only (optional)
tokio = { workspace = true, features = ["rt", "fs", "sync", "time"], optional = true }
parking_lot.workspace = true

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "charset",
    "http2",
    "system-proxy",
    "rustls-tls-native-roots",
] }

# Internal crates
storage = { path = "../storage" }
datastore = { path = "../datastore" }
schema = { path = "../schema" }
document = { path = "../document" }
query = { path = "../query" }
blockstore = { path = "../blockstore" }
crypto = { path = "../crypto" }
defra-core = { path = "../defra-core" }
kms = { path = "../kms" }
identity = { path = "../identity" }
acp = { path = "../acp", default-features = false }
crdt = { path = "../crdt" }
events = { path = "../events", default-features = false }
lens = { path = "../lens", default-features = false }
telemetry = { path = "../telemetry" }

# P2P (optional)

# p2p pulls tokio with features unsupported on wasm32, and every module that
# uses it is already `cfg(not(target_arch = "wasm32"))`. This mirrors how
# db-merge declared it before the fold.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
p2p = { path = "../p2p", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
proptest.workspace = true
blst = "0.3"
getrandom = "0.2"
tempfile = "3"
criterion.workspace = true
ed25519-dalek.workspace = true

[lints]
workspace = true

[[bench]]
name = "block_write"
harness = false

[[bench]]
name = "merge_dag"
harness = false

[[bench]]
name = "vector_mutations"
harness = false

[[bench]]
name = "vector_search"
harness = false

[[bench]]
name = "sift"
harness = false
