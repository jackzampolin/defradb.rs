[package]
name = "db"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DefraDB database and collection management"

[features]
default = ["p2p", "native", "wasmtime-runtime"]
p2p = ["dep:p2p", "dep:libp2p", "p2p/libp2p-transport"]
native = ["dep:tokio", "events/channel", "acp/native"]
redb = ["storage/redb", "acp/redb", "db-nac/redb"]
rocksdb = ["storage/rocksdb"]
fjall = ["storage/fjall"]
wasmtime-runtime = ["lens/wasmtime-runtime"]

[dependencies]
# Async runtime
async-trait.workspace = true
async-lock.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_cbor.workspace = true
serde_bytes.workspace = true
ciborium.workspace = true
chrono = { version = "0.4", features = ["serde"] }

# Bytes (zero-copy block data on hot path)
bytes.workspace = true

# Memory zeroization for sensitive key material
zeroize = "1"

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true

# IPLD
cid.workspace = true
multihash.workspace = true

# Hashing
sha2.workspace = true

# Random number generation (for Counter CRDT nonces)
rand.workspace = true

# HTTP client (for embedding generation API calls)
reqwest = { version = "0.12", features = ["json"] }

# Encoding
base64.workspace = true
hex.workspace = true

# P2P (optional)
libp2p = { workspace = true, optional = true }

# Native-only (optional)
tokio = { workspace = true, features = ["sync"], optional = true }
parking_lot.workspace = true

# Internal crates
db-blocks = { path = "../db-blocks" }
db-index = { path = "../db-index" }
db-nac = { path = "../db-nac", default-features = false }
db-search = { path = "../db-search" }
storage = { path = "../storage" }
datastore = { path = "../datastore" }
schema = { path = "../schema" }
document = { path = "../document" }
query = { path = "../query" }
blockstore = { path = "../blockstore" }
crypto = { path = "../crypto" }
defra-core = { path = "../defra-core" }
kms = { path = "../kms" }
identity = { path = "../identity" }
acp = { path = "../acp", default-features = false }
crdt = { path = "../crdt" }
events = { path = "../events", default-features = false }
lens = { path = "../lens", default-features = false }

# P2P (optional)
p2p = { path = "../p2p", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
proptest.workspace = true
blst = "0.3"
getrandom = "0.2"
tempfile = "3"

[lints]
workspace = true
