[package]
name = "crypto"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Core dependencies
defra-core = { path = "../defra-core" }

# Cryptography (workspace dependencies)
ed25519-dalek.workspace = true
k256.workspace = true
sha2.workspace = true
aes-gcm.workspace = true
p256 = "0.13"              # secp256r1 (P-256) support

# Additional crypto primitives
x25519-dalek = { version = "2.0", features = ["static_secrets"] }     # X25519 ECDH for ECIES
hkdf = "0.12"             # HKDF key derivation for ECIES
hmac = "0.12"             # HMAC authentication for ECIES
rand.workspace = true     # Random number generation for keys and nonces
subtle = "2.5"            # Constant-time operations for key comparison
zeroize = "1.8"           # Secure memory zeroing for sensitive data

# Encoding and serialization
hex = "0.4"               # Hex encoding/decoding
serde.workspace = true
serde_bytes.workspace = true  # Efficient byte serialization

# IPLD
cid.workspace = true      # Content identifiers
multihash.workspace = true # Multihash for CID computation

# DID support
multibase = "0.9"         # Multibase encoding for DID keys
unsigned-varint = "0.8"   # Varint encoding for multicodec

# Error handling
thiserror.workspace = true

# BLS12-381 threshold signature verification (Orbis ring signing) — native only
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blst = "0.3"

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
serial_test = "3.0"
tokio.workspace = true    # Async runtime for tests
multicodec.workspace = true
serde_ipld_dagcbor.workspace = true  # DAG-CBOR for Go interop serialization tests

[lints]
workspace = true
