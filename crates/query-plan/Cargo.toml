[package]
name = "query-plan"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Query plan tree, planner, and fetcher/mutator/txn abstractions for DefraDB"

[dependencies]
web-time.workspace = true
# Internal crates
cursor = { path = "../cursor" }
query-types = { path = "../query-types" }
defra-core = { path = "../defra-core" }
document = { path = "../document" }
storage = { path = "../storage" }
schema = { path = "../schema" }
identity = { path = "../identity" }
acp = { path = "../acp" }
lens = { path = "../lens", default-features = false }

# Async runtime
async-trait.workspace = true
async-lock.workspace = true
futures.workspace = true

# Serialization
serde_json.workspace = true

# Content addressing
cid.workspace = true

# Logging
tracing.workspace = true

# Time handling
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.35", default-features = false, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
query-parse = { path = "../query-parse" }

[lints]
workspace = true
