[package]
name = "defra-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reusable embedded DefraDB node builder"

[[bin]]
name = "coding-session-bench"
path = "src/bin/coding-session-bench.rs"
test = false

[features]
default = ["lark", "redb"]
lark = ["storage/lark"]
http = ["dep:defra-http", "dep:axum"]
p2p = ["dep:p2p", "dep:blockstore", "dep:cid", "dep:defra-http", "dep:defra-p2p-adapter"]
redb = ["storage/redb"]
rocksdb = ["storage/rocksdb"]
# Compile in OpenTelemetry exporter support. Mirrors the CLI's `otel` feature
# and the underlying `telemetry/otlp` gate. Off by default — embedded users
# who want OTel must opt in.
otel = ["dep:telemetry", "telemetry/otlp"]

[dependencies]
db = { path = "../db" }
db-merge = { path = "../db-merge" }
replication-filter = { path = "../replication-filter" }
storage = { path = "../storage" }
query = { path = "../query" }
events = { path = "../events" }
acp = { path = "../acp" }
sourcehub = { path = "../sourcehub" }
identity = { path = "../identity" }
defra-core = { path = "../defra-core" }
schema = { path = "../schema" }
lens = { path = "../lens" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
axum = { workspace = true, optional = true }
reqwest = { version = "0.12", features = ["json"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Optional — HTTP server
defra-http = { path = "../http", optional = true }

# Optional — P2P replication (IROH transport)
p2p = { path = "../p2p", optional = true, features = ["iroh-transport"] }
blockstore = { path = "../blockstore", optional = true }
# Collection-commit retry records replay by CID (defradb#1113).
cid = { workspace = true, optional = true }
defra-p2p-adapter = { workspace = true, optional = true, default-features = false, features = ["iroh"] }

# Optional — OpenTelemetry exporter (see the `otel` feature)
telemetry = { path = "../telemetry", optional = true, default-features = false }

[dev-dependencies]
axum.workspace = true
crypto = { path = "../crypto" }
hex.workspace = true

[lints]
workspace = true
