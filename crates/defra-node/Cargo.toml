[package]
name = "defra-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reusable embedded DefraDB node builder"

[package.metadata.cargo-machete]
ignored = ["thiserror"]

[[bin]]
name = "coding-session-bench"
path = "src/bin/coding-session-bench.rs"
test = false

[features]
default = ["lark", "redb", "native", "sourcehub", "wasmtime-runtime"]
lark = ["storage/lark"]
http = ["dep:defra-http", "dep:axum"]
# Iroh/QUIC only. Implies native. Does not enable libp2p.
p2p = [
    "native",
    "dep:p2p",
    "dep:blockstore",
    "dep:cid",
    "dep:defra-http",
    "dep:defra-p2p-adapter",
    "p2p/iroh-transport",
    "defra-p2p-adapter/iroh",
    "defra-p2p-adapter/native",
]
redb = ["storage/redb"]
rocksdb = ["storage/rocksdb"]
# Native host (tokio, event channel). Default-on.
native = ["db/native", "db-merge/native"]
# SourceHub / hub.rs on-chain document ACP. Default-on; omit for local-only ACP.
sourcehub = ["dep:sourcehub"]
# Lens WASM execution. Default-on; without it set_migration fails explicitly.
# Weak-dep `?` forwards onto the optional adapter only when `p2p` enabled it.
wasmtime-runtime = [
    "db/wasmtime-runtime",
    "db-merge/wasmtime-runtime",
    "lens/wasmtime-runtime",
    "defra-p2p-adapter?/wasmtime-runtime",
]
# Compile in OpenTelemetry exporter support. Mirrors the CLI's `otel` feature
# and the underlying `telemetry/otlp` gate. Off by default — embedded users
# who want OTel must opt in.
otel = ["telemetry/otlp"]

[dependencies]
db = { path = "../db", default-features = false }
db-merge = { path = "../db-merge", default-features = false }
replication-filter = { path = "../replication-filter" }
storage = { path = "../storage" }
query = { path = "../query" }
events = { path = "../events" }
rand.workspace = true
acp = { path = "../acp" }
sourcehub = { path = "../sourcehub", optional = true }
identity = { path = "../identity" }
defra-core = { path = "../defra-core" }
schema = { path = "../schema" }
lens = { path = "../lens", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "net", "sync", "time"] }
anyhow.workspace = true
tracing.workspace = true
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
axum = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "charset",
    "http2",
    "system-proxy",
    "rustls-tls-native-roots",
] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Optional — HTTP server
defra-http = { path = "../http", optional = true }

# Optional — P2P replication (IROH transport)
p2p = { path = "../p2p", optional = true, features = ["iroh-transport"] }
blockstore = { path = "../blockstore", optional = true }
# Collection-commit retry records replay by CID (defradb#1113).
cid = { workspace = true, optional = true }
defra-p2p-adapter = { workspace = true, optional = true, default-features = false, features = ["iroh"] }

# Optional — OpenTelemetry exporter (see the `otel` feature)
telemetry = { path = "../telemetry", default-features = false }

[dev-dependencies]
axum.workspace = true
crypto = { path = "../crypto" }
hex.workspace = true
tempfile = "3"

[lints]
workspace = true
