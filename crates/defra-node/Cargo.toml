[package]
name = "defra-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reusable embedded DefraDB node builder"

[[bin]]
name = "coding-session-bench"
path = "src/bin/coding-session-bench.rs"
required-features = ["rocksdb"]
test = false

[features]
default = ["redb"]
http = ["dep:defra-http", "dep:axum"]
p2p = ["dep:p2p", "dep:blockstore"]
redb = ["storage/redb"]
rocksdb = ["storage/rocksdb"]

[dependencies]
db = { path = "../db" }
db-merge = { path = "../db-merge" }
storage = { path = "../storage" }
query = { path = "../query" }
events = { path = "../events" }
acp = { path = "../acp" }
sourcehub = { path = "../sourcehub" }
identity = { path = "../identity" }
defra-core = { path = "../defra-core" }
schema = { path = "../schema" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
axum = { workspace = true, optional = true }
reqwest = { version = "0.12", features = ["json"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Optional — HTTP server
defra-http = { path = "../http", optional = true }

# Optional — P2P replication (IROH transport)
p2p = { path = "../p2p", optional = true, features = ["iroh-transport"] }
blockstore = { path = "../blockstore", optional = true }

[dev-dependencies]
axum.workspace = true

[lints]
workspace = true
