[package]
name = "sourcehub"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SourceHub ACP client for DefraDB"

[dependencies]
# HTTP client for REST/LCD and CometBFT JSON-RPC
reqwest = { version = "0.12", features = ["json"] }

# Cosmos SDK transaction building and signing
cosmrs = { version = "0.22", features = ["rpc"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async
tokio.workspace = true
async-trait.workspace = true

# Error handling
thiserror.workspace = true

# Cryptography (secp256k1 signing key)
k256.workspace = true
sha2.workspace = true
hex.workspace = true

# Internal crates
acp = { path = "../acp" }
identity = { path = "../identity" }
defra-core = { path = "../defra-core" }
crypto = { path = "../crypto" }

# Base64 for bearer token
base64.workspace = true
