[package]
name = "sourcehub"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SourceHub ACP client for DefraDB"

[dependencies]
# HTTP client for REST/LCD and CometBFT JSON-RPC
reqwest = { version = "0.12", features = ["json"] }

# Cosmos SDK transaction building and signing
cosmrs = "0.22"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async
tokio.workspace = true
async-trait.workspace = true

# Error handling
thiserror.workspace = true

# Cryptography (secp256k1 signing key)
k256.workspace = true
hex.workspace = true

# Internal crates
acp = { path = "../acp" }
zanzibar = { path = "../zanzibar" }
identity = { path = "../identity" }
defra-core = { path = "../defra-core" }
crypto = { path = "../crypto" }
events = { path = "../events" }

# Logging
tracing.workspace = true
sha2.workspace = true

# Base64 for bearer token
base64.workspace = true

# EVM / Alloy (hub.rs ACP backend)
alloy-sol-types.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true
alloy-rlp.workspace = true
bs58.workspace = true

# ACP light client (proof-validated cache)
acp-light-client = { git = "ssh://git@github.com/sourcenetwork/backbone.git", rev = "086ddadc98bc55183920aa0fe6bc4d3719e0e5e7" }

[lints]
workspace = true
