[package]
name = "storage"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
bench = false

[dependencies]
web-time.workspace = true
defra-core = { path = "../defra-core" }
document = { path = "../document" }
schema = { path = "../schema" }
crypto = { path = "../crypto" }
zeroize = "1.8"
regolith.workspace = true
bytes.workspace = true
chrono = { version = "0.4", features = ["serde"] }

# Async runtime
async-lock.workspace = true
async-trait.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# IPLD
cid.workspace = true
# multihash.workspace = true  # Not needed yet in Phase 1

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true
telemetry = { path = "../telemetry" }

# Full-text search
bm25.workspace = true

# Utilities
hex = "0.4"
parking_lot = "0.12"

[features]
# regolith is the only backend, on every target, so there is nothing here to
# select between. `wasm` still exists because it turns off the tokio-dependent
# parts of this crate, not because it picks a different store.
default = []
wasm = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1.0", features = ["v4", "js"] }

# Tokio is only available on non-WASM targets
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
futures.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
proptest.workspace = true
tempfile = "3.8"

[lints]
workspace = true
