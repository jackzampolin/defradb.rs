[package]
name = "storage"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
defra-core = { path = "../defra-core" }
document = { path = "../document" }
schema = { path = "../schema" }
chrono = { version = "0.4", features = ["serde"] }

# Async runtime
async-trait.workspace = true
futures.workspace = true

# Storage backends
redb = { workspace = true, optional = true }
# rusty-leveldb v4 has optional fs feature - we disable it for WASM
rusty-leveldb = { version = "4", optional = true, default-features = false }

# Serialization
serde.workspace = true
serde_cbor.workspace = true

# IPLD
cid.workspace = true
# multihash.workspace = true  # Not needed yet in Phase 1

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true

# Utilities
hex = "0.4"
parking_lot = "0.12"

[features]
default = ["redb"]
redb = ["dep:redb"]
# LevelDB backend - pure Rust LSM-tree implementation (WASM only due to !Send)
# Also requires wasm-bindgen-futures for async discard callbacks
leveldb = ["dep:rusty-leveldb", "dep:wasm-bindgen-futures"]
# WASM support - disables tokio-dependent features
wasm = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1.0", features = ["v4", "js"] }

# wasm-bindgen-futures is needed for leveldb async discard callbacks
wasm-bindgen-futures = { version = "0.4", optional = true }

# Tokio is only available on non-WASM targets
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion = "0.5"
tempfile = "3.8"
