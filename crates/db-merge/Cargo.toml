[package]
name = "db-merge"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "P2P merge handler, broadcast mutator, and document pushing for DefraDB"

[features]
default = ["native", "wasmtime-runtime"]
native = ["db/native"]
wasmtime-runtime = ["db/wasmtime-runtime"]

[dependencies]
# Async
async-trait.workspace = true
async-lock = "3"
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_cbor.workspace = true
serde_bytes.workspace = true
ciborium = "0.2"
hex.workspace = true

# Bytes
bytes.workspace = true

# Memory zeroization
zeroize = "1"

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true
telemetry = { path = "../telemetry" }

# IPLD
cid.workspace = true

# Synchronization
parking_lot.workspace = true

# Internal crates
db = { path = "../db", default-features = false }
db-blocks = { path = "../db-blocks" }
storage = { path = "../storage" }
datastore = { path = "../datastore" }
blockstore = { path = "../blockstore" }
schema = { path = "../schema" }
document = { path = "../document" }
query = { path = "../query" }
crypto = { path = "../crypto" }
crdt = { path = "../crdt" }
defra-core = { path = "../defra-core" }
identity = { path = "../identity" }
acp = { path = "../acp", default-features = false }
events = { path = "../events", default-features = false }
kms = { path = "../kms" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["sync"] }
libp2p.workspace = true
p2p = { path = "../p2p", features = ["libp2p-transport"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
blst = "0.3"
getrandom = "0.2"
criterion.workspace = true

[[bench]]
name = "merge_dag"
harness = false

[lints]
workspace = true
