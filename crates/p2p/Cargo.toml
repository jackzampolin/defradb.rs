[package]
name = "p2p"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "P2P networking for DefraDB using libp2p"

[dependencies]
# Internal crates
defra-core = { path = "../defra-core" }
document = { path = "../document" }
crypto = { path = "../crypto" }
blockstore = { path = "../blockstore" }
crdt = { path = "../crdt" }
storage = { path = "../storage" }
identity = { path = "../identity" }
acp = { path = "../acp" }
kms = { path = "../kms" }

# libp2p transport
libp2p = { workspace = true, features = ["tcp", "noise", "yamux", "identify", "request-response", "macros", "tokio", "gossipsub", "kad", "relay", "dns", "quic", "websocket", "memory-connection-limits"], optional = true }
iroh-bitswap = { workspace = true, optional = true }
libp2p-stream = { workspace = true, optional = true }
multiaddr = { workspace = true, optional = true }

# Async
tokio = { workspace = true, features = ["sync", "rt", "macros", "fs"] }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
ciborium = { workspace = true }
serde_bytes = { workspace = true }
postcard = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

# UUID for message IDs
uuid = { workspace = true }

# IPLD
cid = { workspace = true }
multihash-codetable = { workspace = true }
ipld-core = { workspace = true }
serde_ipld_dagcbor = { workspace = true }

# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
rlimit = { version = "0.9", optional = true }
sysinfo = { version = "0.33", optional = true }

# Bytes
bytes = { workspace = true }

# Varint encoding for CARv1 format
unsigned-varint = "0.8"

# Synchronization (non-poisoning locks)
parking_lot = { workspace = true }

# Iroh transport (optional)
iroh = { workspace = true, optional = true }
iroh-gossip = { workspace = true, optional = true }
iroh-tickets = { workspace = true, optional = true }
# Preserve the noq defaults and feature aliases that iroh-blobs previously
# enabled transitively, including the Iroh endpoint's bloom token log.
noq = { version = "1.1", features = ["bloom", "rustls-ring"], optional = true }
rand = { version = "0.9", optional = true }
blake3 = { version = "1", optional = true }

[features]
default = []
test-utils = ["libp2p-transport"]
libp2p-transport = [
    "dep:iroh-bitswap",
    "dep:libp2p",
    "dep:libp2p-stream",
    "dep:multiaddr",
    "dep:rlimit",
    "dep:sysinfo",
]
iroh-transport = ["dep:iroh", "dep:iroh-gossip", "dep:iroh-tickets", "dep:noq", "dep:rand", "dep:blake3"]

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
p2p = { path = ".", features = ["test-utils"] }

[package.metadata.cargo-machete]
ignored = ["crdt", "multiaddr", "noq", "rand"]

[lints]
workspace = true
