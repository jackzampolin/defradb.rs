[package]
name = "p2p"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "P2P networking for DefraDB using libp2p"

[dependencies]
# Internal crates
defra-core = { path = "../defra-core" }
crypto = { path = "../crypto" }
blockstore = { path = "../blockstore" }
crdt = { path = "../crdt" }
storage = { path = "../storage" }
identity = { path = "../identity" }
acp = { path = "../acp" }

# P2P
libp2p = { workspace = true, features = ["tcp", "noise", "yamux", "identify", "request-response", "macros", "tokio", "gossipsub", "kad", "relay"] }
iroh-bitswap = { workspace = true }
libp2p-stream = { workspace = true }
multiaddr = { workspace = true }

# Async
tokio = { workspace = true, features = ["sync", "rt", "macros", "fs"] }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_cbor = { workspace = true }
serde_bytes = { workspace = true }
base64 = { workspace = true }

# UUID for message IDs
uuid = { workspace = true }

# IPLD
cid = { workspace = true }
libipld = { workspace = true }

# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

# Bytes
bytes = { workspace = true }

# Varint encoding for CARv1 format
unsigned-varint = "0.8"

# Synchronization (non-poisoning locks)
parking_lot = { workspace = true }

# Void type used by libp2p connection-limits behaviour (never emits events)
void = "1.0.2"

# Iroh transport (optional)
iroh = { workspace = true, optional = true }
iroh-gossip = { workspace = true, optional = true }
iroh-blobs = { workspace = true, optional = true }
iroh-tickets = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
rand = { version = "0.9", optional = true }
blake3 = { version = "1", optional = true }

[features]
default = []
test-utils = []
iroh-transport = ["dep:iroh", "dep:iroh-gossip", "dep:iroh-blobs", "dep:iroh-tickets", "dep:postcard", "dep:rand", "dep:blake3"]

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
p2p = { path = ".", features = ["test-utils"] }
ciborium = { workspace = true }
