[package]
name = "p2p"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "P2P networking for DefraDB using libp2p"

[dependencies]
# Internal crates
defra-core = { path = "../defra-core" }
crypto = { path = "../crypto" }
blockstore = { path = "../blockstore" }
crdt = { path = "../crdt" }
storage = { path = "../storage" }

# P2P
libp2p = { workspace = true, features = ["tcp", "noise", "yamux", "identify", "mdns", "request-response", "macros", "tokio", "gossipsub", "kad"] }
libp2p-bitswap-next = { workspace = true }
multiaddr = { workspace = true }

# Async
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_cbor = { workspace = true }

# UUID for message IDs
uuid = { workspace = true }

# IPLD
cid = { workspace = true }
libipld = { workspace = true }

# Errors
thiserror = { workspace = true }
tracing = { workspace = true }

# Synchronization (non-poisoning locks)
parking_lot = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
