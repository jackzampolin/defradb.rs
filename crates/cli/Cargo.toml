[package]
name = "cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
ignored = ["anyhow", "bytes", "futures", "getrandom", "rand", "serde_bytes", "serde_ipld_dagcbor"]

[lib]
bench = false
name = "cli"
path = "src/lib.rs"

[[bin]]
name = "defra"
path = "src/main.rs"

[dependencies]
# Internal crates
acp = { path = "../acp" }
bytes.workspace = true
defra-core = { path = "../defra-core" }
storage = { path = "../storage" }
blockstore = { path = "../blockstore" }
crypto = { path = "../crypto" }
identity = { path = "../identity" }
kms = { path = "../kms" }
p2p = { path = "../p2p", features = ["libp2p-transport"] }
defra-p2p-adapter = { path = "../p2p-adapter", default-features = false, features = ["libp2p"] }
defra-http = { path = "../http" }
query = { path = "../query" }
replication-filter = { path = "../replication-filter" }
db = { path = "../db" }
schema = { path = "../schema" }
events = { path = "../events" }
lens = { path = "../lens" }
document = { path = "../document" }
keyring = { path = "../keyring" }
orbis = { path = "../orbis", optional = true }
sourcehub = { path = "../sourcehub", optional = true }
defra-version = { path = "../defra-version" }
pg-compat = { path = "../pg-compat", optional = true }
telemetry = { path = "../telemetry", default-features = false }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "signal", "sync", "time"] }
futures = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-chrome = { version = "0.7", optional = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# File system
dirs = "5.0"

# Random number generation
getrandom = "0.2"

# Hex encoding/decoding
hex = "0.4"

# Zeroizing wrapper for the searchable-encryption key passed to db::merge
zeroize = "1"

# Base64 encoding/decoding (JWK export/import)
base64 = { workspace = true }

# IPLD
serde_ipld_dagcbor = { workspace = true }
serde_bytes = { workspace = true }

# libp2p (for P2P keypair types)
libp2p = { workspace = true }

# HTTP client for CLI client commands
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "charset",
    "http2",
    "system-proxy",
    "rustls-tls-native-roots",
] }

# URL parsing
url = "2.5"

# URL encoding for query parameters
urlencoding = "2.1"

[dependencies.iroh-net]
package = "iroh"
version = "1.0.0-rc.0"
optional = true

[dependencies.rand]
version = "0.9"
optional = true

[features]
default = []
release-full = ["postgres", "sourcehub", "orbis"]
postgres = ["dep:pg-compat"]
# SourceHub/hub.rs on-chain document ACP (`--document-acp-type source-hub|hub-rs`).
sourcehub = ["dep:sourcehub"]
# Orbis ring threshold signing (`--signer-type orbis`).
orbis = ["dep:orbis"]
iroh = ["p2p/iroh-transport", "defra-p2p-adapter/iroh", "dep:iroh-net", "dep:rand"]
profiling = ["dep:tracing-chrome"]
# OpenTelemetry OTLP exporter. Mirrors Go's `//go:build telemetry`: compile-time
# opt-in. When built with this feature, runtime default is on (Go parity); use
# `--no-telemetry` to disable at runtime.
otel = ["telemetry/otlp"]

[dev-dependencies]
tempfile = "3.17"
portpicker = "0.1"

[lints]
workspace = true
