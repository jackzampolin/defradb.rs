[package]
name = "cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "cli"
path = "src/lib.rs"

[[bin]]
name = "defra"
path = "src/main.rs"

[dependencies]
# Internal crates
acp = { path = "../acp" }
bytes.workspace = true
defra-core = { path = "../defra-core" }
storage = { path = "../storage" }
blockstore = { path = "../blockstore" }
crypto = { path = "../crypto" }
identity = { path = "../identity" }
kms = { path = "../kms" }
p2p = { path = "../p2p", features = ["libp2p-transport"] }
defra-http = { path = "../http" }
query = { path = "../query" }
db = { path = "../db" }
db-backup = { path = "../db-backup" }
db-merge = { path = "../db-merge" }
schema = { path = "../schema" }
events = { path = "../events" }
lens = { path = "../lens" }
document = { path = "../document" }
keyring = { path = "../keyring" }
orbis = { path = "../orbis" }
sourcehub = { path = "../sourcehub" }
defra-version = { path = "../defra-version" }
pg-compat = { path = "../pg-compat" }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-chrome = { version = "0.7", optional = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# File system
dirs = "5.0"

# Random number generation
getrandom = "0.2"

# Hex encoding/decoding
hex = "0.4"

# Zeroizing wrapper for the searchable-encryption key passed to db-merge
zeroize = "1"

# Base64 encoding/decoding (JWK export/import)
base64 = { workspace = true }

# IPLD (for Bitswap type parameters)
libipld = { workspace = true }
cid = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
serde_bytes = { workspace = true }

# libp2p (for P2P keypair types)
libp2p = { workspace = true }

# HTTP client for CLI client commands
reqwest = { version = "0.12", features = ["json"] }

# URL parsing
url = "2.5"

# URL encoding for query parameters
urlencoding = "2.1"

[dependencies.openssl-sys]
version = "0.9"
features = ["vendored"]
optional = true

[dependencies.iroh-net]
package = "iroh"
version = "1.0.0-rc.0"
optional = true

[dependencies.rand]
version = "0.9"
optional = true

[features]
default = ["rocksdb", "redb"]
redb = ["storage/redb"]
fjall = ["storage/fjall"]
rocksdb = ["storage/rocksdb"]
vendored-openssl = ["dep:openssl-sys"]
iroh = ["p2p/iroh-transport", "dep:iroh-net", "dep:rand"]
profiling = ["dep:tracing-chrome"]

[dev-dependencies]
tempfile = "3.17"
portpicker = "0.1"

[lints]
workspace = true
