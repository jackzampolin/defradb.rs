[package]
name = "lens"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lens schema migration support for DefraDB"

[features]
default = ["wasmtime-runtime"]
wasmtime-runtime = ["dep:wasmtime", "dep:tokio", "dep:parking_lot"]

[dependencies]
# Core
async-trait.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true

# Encoding
base64.workspace = true

# Hashing for content-based deduplication
sha2.workspace = true
hex.workspace = true

# Wasmtime runtime dependencies (optional for wasm32)
tokio = { workspace = true, features = ["rt"], optional = true }
parking_lot = { workspace = true, optional = true }
wasmtime = { version = "46.0.2", optional = true, default-features = false, features = [
    "runtime",
    "cranelift",
    "std",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
