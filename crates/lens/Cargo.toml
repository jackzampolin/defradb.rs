[package]
name = "lens"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lens schema migration support for DefraDB"

[features]
default = ["wasmtime-runtime"]
wasmtime-runtime = ["dep:wasmtime", "dep:tokio", "dep:tokio-stream", "dep:parking_lot"]

[dependencies]
# Core
async-trait.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true

# Encoding
base64.workspace = true

# Hashing for content-based deduplication
sha2.workspace = true
hex.workspace = true

# Wasmtime runtime dependencies (optional for wasm32)
tokio = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
wasmtime = { version = "27", optional = true }

[dev-dependencies]
proptest.workspace = true
