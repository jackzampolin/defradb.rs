[package]
name = "keyring"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Keyring and key management for DefraDB"

[dependencies]
thiserror.workspace = true
base64 = "0.22"
zeroize = "1.8"

# JWE encryption (PBES2-HS512-A256KW) - Go compatible format
josekit = "0.8"

# OS keyring (macOS Keychain, Linux Secret Service, Windows Credential Manager)
# Renamed to avoid conflict with our crate name
keyring_crate = { package = "keyring", version = "3" }

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
