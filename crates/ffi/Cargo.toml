[package]
name = "ffi"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "FFI bindings for DefraDB Rust implementation"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["lark", "redb", "rocksdb"]
lark = ["storage/lark"]
redb = ["storage/redb"]
fjall = ["storage/fjall"]
rocksdb = ["storage/rocksdb"]
iroh = ["embedded/iroh", "p2p/iroh-transport"]
profiling = ["dep:tracing-chrome", "dep:tracing-subscriber"]

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
async-trait.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
serde_ipld_dagcbor.workspace = true
serde_bytes.workspace = true

# Memory zeroization for sensitive key material
zeroize = "1"

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true
tracing-chrome = { version = "0.7", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"], optional = true }

# Synchronization
parking_lot.workspace = true

# Cryptographic hashing
sha2.workspace = true
hex.workspace = true

# Internal crates
crypto = { path = "../crypto" }
db = { path = "../db" }
db-backup = { path = "../db-backup" }
db-merge = { path = "../db-merge" }
defra-core = { path = "../defra-core" }
defra-http = { path = "../http" }
document = { path = "../document" }
events = { path = "../events" }
storage = { path = "../storage" }
query = { path = "../query" }
schema = { path = "../schema" }
identity = { path = "../identity" }
acp = { path = "../acp" }
sourcehub = { path = "../sourcehub" }
lens = { path = "../lens" }
p2p = { path = "../p2p", features = ["libp2p-transport"] }
blockstore = { path = "../blockstore" }
embedded = { path = "../embedded" }

# IPLD
cid.workspace = true

# P2P dependencies
libp2p = { workspace = true }

[build-dependencies]
cbindgen = "0.28"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
